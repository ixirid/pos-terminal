<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS Терминал</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --error: #ef4444;
      --bg-base: #090d16;
      --surface: #111827;
      --surface-card: #1f2937;
      --surface-hover: #374151;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(17, 24, 39, 0.8); border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; }
    .brand-icon { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

    .main { flex: 1; display: flex; justify-content: center; padding: 16px; }
    .panel { width: 100%; max-width: 500px; background: var(--surface); border-radius: 20px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; }

    .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(0,0,0,0.2); padding: 4px; gap: 4px; }
    .tab-btn { background: none; border: none; color: var(--text-muted); padding: 12px 4px; font-weight: 700; font-size: 13px; border-radius: 10px; cursor: pointer; }
    .tab-btn.active { background: var(--surface-card); color: #fff; }

    .content { padding: 20px; display: none; flex-direction: column; gap: 16px; flex: 1; }
    .content.active { display: flex; }

    .display-box { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 16px; text-align: right; border: 1px solid var(--border-color); }
    .amount { font-size: 38px; font-weight: 900; color: #fff; }

    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; }

    .btn { background: var(--surface-card); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; font-weight: 700; font-size: 18px; padding: 14px; cursor: pointer; }
    .btn:active { background: var(--surface-hover); }
    .btn-action { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; padding: 16px; font-size: 16px; width: 100%; margin-top: auto; }

    /* Полноэкранный оверлей для всего интерфейса */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(9, 13, 22, 0.95);
      z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;
    }
    .modal-overlay.active { display: flex; }

    .receipt-item { background: var(--surface-card); padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .receipt-link { color: var(--primary); text-decoration: none; font-weight: bold; }

    .display-card { background: var(--surface-card); padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="brand-icon">₽</div>
      <div>POS Терминал</div>
    </div>
    <a href="/display" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: bold; font-size: 13px;">📺 Экран</a>
  </header>

  <main class="main">
    <section class="panel">
      <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('charge')">💸 Оплата</button>
        <button class="tab-btn" onclick="switchTab('topup')">➕ Пополнение</button>
        <button class="tab-btn" onclick="switchTab('receipts')">🧾 Чеки</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ Настройки</button>
      </nav>

      <!-- Вкладка Оплаты -->
      <div class="content active" id="tabCharge">
        <div class="display-box">
          <span id="chargeAmount">0</span> <span style="color: var(--primary);">₽</span>
        </div>
        <div class="grid-4">
          <button class="btn" onclick="addPreset('charge', 100)">+100</button>
          <button class="btn" onclick="addPreset('charge', 500)">+500</button>
          <button class="btn" onclick="addPreset('charge', 1000)">+1k</button>
          <button class="btn" onclick="addPreset('charge', 5000)">+5k</button>
        </div>
        <div class="grid-3">
          <button class="btn" onclick="num('charge','1')">1</button>
          <button class="btn" onclick="num('charge','2')">2</button>
          <button class="btn" onclick="num('charge','3')">3</button>
          <button class="btn" onclick="num('charge','4')">4</button>
          <button class="btn" onclick="num('charge','5')">5</button>
          <button class="btn" onclick="num('charge','6')">6</button>
          <button class="btn" onclick="num('charge','7')">7</button>
          <button class="btn" onclick="num('charge','8')">8</button>
          <button class="btn" onclick="num('charge','9')">9</button>
          <button class="btn" style="color:#f87171;" onclick="clearNum('charge')">C</button>
          <button class="btn" onclick="num('charge','0')">0</button>
          <button class="btn" style="color:#60a5fa;" onclick="backspace('charge')">⌫</button>
        </div>
        <button class="btn btn-action" onclick="handleGenerateQr()">Сгенерировать QR-код</button>
      </div>

      <!-- Вкладка Пополнения -->
      <div class="content" id="tabTopup">
        <div class="display-box">
          <span id="topupAmount">0</span> <span style="color: var(--primary);">₽</span>
        </div>
        <div class="grid-4">
          <button class="btn" onclick="addPreset('topup', 100)">+100</button>
          <button class="btn" onclick="addPreset('topup', 500)">+500</button>
          <button class="btn" onclick="addPreset('topup', 1000)">+1k</button>
          <button class="btn" onclick="addPreset('topup', 5000)">+5k</button>
        </div>
        <div class="grid-3">
          <button class="btn" onclick="num('topup','1')">1</button>
          <button class="btn" onclick="num('topup','2')">2</button>
          <button class="btn" onclick="num('topup','3')">3</button>
          <button class="btn" onclick="num('topup','4')">4</button>
          <button class="btn" onclick="num('topup','5')">5</button>
          <button class="btn" onclick="num('topup','6')">6</button>
          <button class="btn" onclick="num('topup','7')">7</button>
          <button class="btn" onclick="num('topup','8')">8</button>
          <button class="btn" onclick="num('topup','9')">9</button>
          <button class="btn" style="color:#f87171;" onclick="clearNum('topup')">C</button>
          <button class="btn" onclick="num('topup','0')">0</button>
          <button class="btn" style="color:#60a5fa;" onclick="backspace('topup')">⌫</button>
        </div>
        <button class="btn btn-action" onclick="submitTopup()">Внести на счет</button>
      </div>

      <!-- Вкладка Чеков -->
      <div class="content" id="tabReceipts">
        <h3 style="margin-bottom: 12px;">История операций</h3>
        <div id="receiptsList" style="overflow-y: auto; flex: 1;"></div>
      </div>

      <!-- Вкладка Настроек -->
      <div class="content" id="tabSettings">
        <h3>Активные дисплеи</h3>
        <div id="displaysList" style="margin: 12px 0;"></div>
        <hr style="border-color: var(--border-color); margin: 16px 0;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="chkAskEveryTime" onchange="toggleAskEveryTime(this.checked)">
          <span>Спрашивать экран перед каждым QR</span>
        </label>
      </div>
    </section>
  </main>

  <!-- Полноэкранный оверлей выбора дисплея -->
  <div class="modal-overlay" id="selectDisplayModal">
    <h2>Выберите дисплей для отправки</h2>
    <div id="modalDisplaysList" style="width: 100%; max-width: 300px; margin: 20px 0;"></div>
    <button class="btn" onclick="closeModal('selectDisplayModal')">Отмена</button>
  </div>

  <!-- Полноэкранный оверлей успешной оплаты -->
  <div class="modal-overlay" id="successModal">
    <div style="font-size: 60px; color: var(--primary);">✓</div>
    <h2>Оплачено успешно!</h2>
    <p style="font-size: 20px; margin: 12px 0;">Сумма: <strong id="successAmount">0 ₽</strong></p>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Остаток на карте: <span id="successRemaining">0 ₽</span></p>
    <button class="btn btn-action" onclick="closeModal('successModal')">Закрыть</button>
  </div>

  <!-- Полноэкранный оверлей ошибки оплаты -->
  <div class="modal-overlay" id="errorModal">
    <div style="font-size: 60px; color: var(--error);">✕</div>
    <h2>Ошибка оплаты</h2>
    <p style="color: var(--text-muted); margin: 12px 0;">Недостаточно средств на карте!</p>
    <button class="btn btn-action" style="background: var(--error);" onclick="closeModal('errorModal')">Закрыть</button>
  </div>

  <script>
    const socket = io();
    let currentTab = 'charge';
    let displays = [];
    let askEveryTime = false;

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
      if (tab === 'receipts') loadReceipts();
    }

    function num(type, val) {
      const el = document.getElementById(type + 'Amount');
      let current = el.textContent.replace(/\D/g, '');
      if (current === '0') current = val;
      else if (current.length < 7) current += val;
      el.textContent = parseInt(current, 10).toLocaleString('ru-RU');
    }

    function clearNum(type) { document.getElementById(type + 'Amount').textContent = '0'; }
    function backspace(type) {
      const el = document.getElementById(type + 'Amount');
      let current = el.textContent.replace(/\D/g, '').slice(0, -1);
      el.textContent = (current === '' ? '0' : parseInt(current, 10)).toLocaleString('ru-RU');
    }
    function addPreset(type, val) {
      const el = document.getElementById(type + 'Amount');
      let current = parseInt(el.textContent.replace(/\D/g, '') || '0', 10) + val;
      el.textContent = current.toLocaleString('ru-RU');
    }

    function handleGenerateQr() {
      const amount = parseInt(document.getElementById('chargeAmount').textContent.replace(/\D/g, '') || '0', 10);
      if (amount <= 0) return;

      if (askEveryTime && displays.length > 0) {
        openSelectDisplayModal();
      } else {
        sendQr(amount, null);
      }
    }

    function sendQr(amount, displayId) {
      fetch('/api/create-transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, displayId })
      });
      closeModal('selectDisplayModal');
    }

    function openSelectDisplayModal() {
      const container = document.getElementById('modalDisplaysList');
      const amount = parseInt(document.getElementById('chargeAmount').textContent.replace(/\D/g, '') || '0', 10);
      container.innerHTML = displays.map(d => `
        <button class="btn" style="width: 100%; margin-bottom: 8px;" onclick="sendQr(${amount}, '${d.id}')">
          ${d.name} ${d.isLocked ? '🔒' : ''}
        </button>
      `).join('');
      document.getElementById('selectDisplayModal').classList.add('active');
    }

    function submitTopup() {
      const amount = parseInt(document.getElementById('topupAmount').textContent.replace(/\D/g, '') || '0', 10);
      if (amount <= 0) return;
      fetch('/api/topup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount })
      }).then(() => {
        clearNum('topup');
        alert('Баланс успешно пополнен!');
      });
    }

    function loadReceipts() {
      fetch('/api/receipts').then(r => r.json()).then(data => {
        document.getElementById('receiptsList').innerHTML = data.map(r => `
          <div class="receipt-item">
            <div>
              <strong>${r.id}</strong><br>
              <small>${new Date(r.date).toLocaleTimeString('ru-RU')}</small>
            </div>
            <div>
              <strong>${r.type === 'charge' ? '-' : '+'}${r.amount} ₽</strong><br>
              <a href="/api/receipts/${r.id}/download" class="receipt-link">Скачать</a>
            </div>
          </div>
        `).join('');
      });
    }

    function toggleAskEveryTime(val) {
      askEveryTime = val;
      fetch('/api/terminal/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ askEveryTime: val })
      });
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    socket.on('update_displays', (data) => {
      displays = data;
      document.getElementById('displaysList').innerHTML = data.map(d => `
        <div class="display-card">
          <span>${d.name} ${d.isLocked ? '🔒' : ''}</span>
          <div>
            <button class="btn" style="padding: 6px 10px; font-size: 12px;" onclick="renameDisp('${d.id}')">✏️</button>
            <button class="btn" style="padding: 6px 10px; font-size: 12px;" onclick="toggleLock('${d.id}')">${d.isLocked ? '🔓' : '🔒'}</button>
          </div>
        </div>
      `).join('');
    });

    function renameDisp(id) {
      const name = prompt('Введите новое название терминала:');
      if (name) socket.emit('rename_display', { id, name });
    }
    function toggleLock(id) { socket.emit('toggle_lock_display', { id }); }

    socket.on('payment_success', (data) => {
      document.getElementById('successAmount').textContent = data.transaction.amount + ' ₽';
      document.getElementById('successRemaining').textContent = data.cardRemaining + ' ₽';
      document.getElementById('successModal').classList.add('active');
      clearNum('charge');
    });

    socket.on('payment_failed', () => {
      document.getElementById('errorModal').classList.add('active');
    });

    fetch('/api/info').then(r => r.json()).then(d => {
      if (d.settings) {
        askEveryTime = d.settings.askEveryTime;
        document.getElementById('chkAskEveryTime').checked = askEveryTime;
      }
    });
  </script>
</body>
</html>
