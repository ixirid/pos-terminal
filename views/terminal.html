<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POS Терминал Кассы</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #22c55e;
      --primary-dark: #16a34a;
      --error: #ef4444;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-muted: #94a3b8;
    }
    .qr-display-panel, .success-card {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 24px;
    }
    .qr-display-panel.active, .success-card.active {
      display: flex !important;
    }
    .error-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: container;
    }
    .error-overlay.active {
      display: flex !important;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      margin: 20px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .qr-box img {
      width: 220px;
      height: 220px;
      display: block;
    }
    .check-icon-circle {
      width: 80px;
      height: 80px;
      background: var(--primary);
      color: #fff;
      font-size: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
    }
    .error-circle {
      width: 80px;
      height: 80px;
      background: var(--error);
      color: #fff;
      font-size: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
    }
    .qr-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.15);
      padding: 8px 16px;
      border-radius: 20px;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 16px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>

  <header class="pos-header">
    <div class="brand-title">
      <div class="brand-icon">Б</div>
      <div class="brand-text">
        <h1>POS Terminal</h1>
        <p id="serverInfoText">Загрузка адреса...</p>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="/display" target="_blank" style="padding: 8px 14px; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.35); color: var(--primary); border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700;">
        📺 Экран клиента
      </a>
      <div class="status-badge-online">
        <span class="pulse-dot-green"></span>
        <span>Онлайн</span>
      </div>
    </div>
  </header>

  <main class="pos-container">
    <section class="pos-main-panel">
      <nav class="tabs-header">
        <button class="tab-btn active" id="tabBtnCharge" onclick="switchTab('charge')">💸 Оплата</button>
        <button class="tab-btn" id="tabBtnTopup" onclick="switchTab('topup')">➕ Пополнение</button>
      </nav>

      <div class="tab-content active" id="tabCharge">
        <div id="chargeFormView" style="display: flex; flex-direction: column; height: 100%;">
          <div class="amount-display-wrapper">
            <span class="amount-label">Сумма к оплате</span>
            <div class="amount-input-container">
              <input type="text" id="chargeAmount" class="amount-input" value="0" readonly>
              <span class="amount-currency">₽</span>
            </div>
          </div>

          <div class="quick-presets">
            <button class="preset-btn" onclick="addPreset('charge', 100)">+100 ₽</button>
            <button class="preset-btn" onclick="addPreset('charge', 500)">+500 ₽</button>
            <button class="preset-btn" onclick="addPreset('charge', 1000)">+1 000 ₽</button>
            <button class="preset-btn" onclick="addPreset('charge', 5000)">+5 000 ₽</button>
          </div>

          <div class="numpad-grid">
            <button class="num-btn" onclick="appendDigit('charge', '1')">1</button>
            <button class="num-btn" onclick="appendDigit('charge', '2')">2</button>
            <button class="num-btn" onclick="appendDigit('charge', '3')">3</button>
            <button class="num-btn" onclick="appendDigit('charge', '4')">4</button>
            <button class="num-btn" onclick="appendDigit('charge', '5')">5</button>
            <button class="num-btn" onclick="appendDigit('charge', '6')">6</button>
            <button class="num-btn" onclick="appendDigit('charge', '7')">7</button>
            <button class="num-btn" onclick="appendDigit('charge', '8')">8</button>
            <button class="num-btn" onclick="appendDigit('charge', '9')">9</button>
            <button class="num-btn clear" onclick="clearInput('charge')">C</button>
            <button class="num-btn" onclick="appendDigit('charge', '0')">0</button>
            <button class="num-btn action" onclick="backspace('charge')">⌫</button>
          </div>

          <button class="btn-primary" onclick="createQrTransaction()">Сгенерировать QR-код [Enter]</button>
        </div>

        <div class="qr-display-panel" id="qrDisplayPanel">
          <div class="qr-status-badge">
            <span class="pulse-dot"></span>
            <span>Ожидание оплаты клиентом...</span>
          </div>
          <h2 style="font-size: 22px; margin-bottom: 16px; color: #fff;">Сумма: <span id="qrAmountDisplay" style="color: var(--primary);">0 ₽</span></h2>
          <div class="qr-box">
            <img id="qrImage" src="" alt="QR-код">
          </div>
          <button class="btn-secondary" onclick="cancelTransaction()">Отменить оплату [Esc]</button>
        </div>

        <div class="success-card" id="paymentSuccessCard">
          <div class="check-icon-circle">✓</div>
          <h2 style="font-size: 28px; margin-bottom: 8px; color: #fff;">Оплачено успешно!</h2>
          <p style="color: var(--text-muted); font-size: 16px; margin-bottom: 24px;">Сумма: <strong id="successAmountText" style="color: #fff;">0 ₽</strong></p>
          <button class="btn-primary" onclick="resetChargeView()">Новая операция [Enter]</button>
        </div>
      </div>

      <div class="tab-content" id="tabTopup">
        <div style="display: flex; flex-direction: column; height: 100%;">
          <div class="amount-display-wrapper">
            <span class="amount-label">Сумма пополнения</span>
            <div class="amount-input-container">
              <input type="text" id="topupAmount" class="amount-input" value="0" readonly>
              <span class="amount-currency">₽</span>
            </div>
          </div>

          <div class="quick-presets">
            <button class="preset-btn" onclick="addPreset('topup', 100)">+100 ₽</button>
            <button class="preset-btn" onclick="addPreset('topup', 500)">+500 ₽</button>
            <button class="preset-btn" onclick="addPreset('topup', 1000)">+1 000 ₽</button>
            <button class="preset-btn" onclick="addPreset('topup', 5000)">+5 000 ₽</button>
          </div>

          <div class="numpad-grid">
            <button class="num-btn" onclick="appendDigit('topup', '1')">1</button>
            <button class="num-btn" onclick="appendDigit('topup', '2')">2</button>
            <button class="num-btn" onclick="appendDigit('topup', '3')">3</button>
            <button class="num-btn" onclick="appendDigit('topup', '4')">4</button>
            <button class="num-btn" onclick="appendDigit('topup', '5')">5</button>
            <button class="num-btn" onclick="appendDigit('topup', '6')">6</button>
            <button class="num-btn" onclick="appendDigit('topup', '7')">7</button>
            <button class="num-btn" onclick="appendDigit('topup', '8')">8</button>
            <button class="num-btn" onclick="appendDigit('topup', '9')">9</button>
            <button class="num-btn clear" onclick="clearInput('topup')">C</button>
            <button class="num-btn" onclick="appendDigit('topup', '0')">0</button>
            <button class="num-btn action" onclick="backspace('topup')">⌫</button>
          </div>

          <button class="btn-primary" onclick="submitTopup()">Внести на счет [Enter]</button>
        </div>
      </div>
    </section>
  </main>

  <div class="error-overlay" id="errorOverlay">
    <div class="error-circle">✕</div>
    <h2 style="color: #fff; margin-bottom: 8px;">Ошибка оплаты</h2>
    <p class="error-subtitle" style="color: var(--text-muted); margin-bottom: 20px;">Недостаточно средств на балансе карты!</p>
    <div class="error-details" style="color: #fff; margin-bottom: 24px;">
      <div>Требуется: <span id="errorRequiredAmount" style="color: var(--error); font-weight: 700;">0 ₽</span></div>
    </div>
    <button class="btn-primary" onclick="closeErrorOverlay()" style="background: var(--error); max-width: 320px;">Закрыть [Enter]</button>
  </div>

  <script src="/js/audio.js"></script>
  <script>
    const socket = io();
    let currentTab = 'charge';

    fetch('/api/info')
      .then(res => res.json())
      .then(data => {
        if (data.config && data.config.serverIp) {
          document.getElementById('serverInfoText').textContent = `IP: ${data.config.serverIp}`;
        }
      })
      .catch(e => {});

    function switchTab(tab) {
      if (window.terminalAudio) terminalAudio.playTap();
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (tab === 'charge') {
        document.getElementById('tabBtnCharge').classList.add('active');
        document.getElementById('tabCharge').classList.add('active');
      } else {
        document.getElementById('tabBtnTopup').classList.add('active');
        document.getElementById('tabTopup').classList.add('active');
      }
    }

    function appendDigit(type, digit) {
      if (window.terminalAudio) terminalAudio.playTap();
      const inputId = type === 'charge' ? 'chargeAmount' : 'topupAmount';
      const input = document.getElementById(inputId);
      let val = input.value.replace(/\D/g, '');
      if (val === '0' || val === '') {
        val = digit;
      } else {
        if (val.length < 7) val += digit;
      }
      input.value = parseInt(val, 10).toLocaleString('ru-RU');
    }

    function backspace(type) {
      if (window.terminalAudio) terminalAudio.playTap();
      const inputId = type === 'charge' ? 'chargeAmount' : 'topupAmount';
      const input = document.getElementById(inputId);
      let val = input.value.replace(/\D/g, '');
      val = val.slice(0, -1);
      input.value = (val === '' ? '0' : parseInt(val, 10)).toLocaleString('ru-RU');
    }

    function clearInput(type) {
      if (window.terminalAudio) terminalAudio.playTap();
      const inputId = type === 'charge' ? 'chargeAmount' : 'topupAmount';
      document.getElementById(inputId).value = '0';
    }

    function addPreset(type, amount) {
      if (window.terminalAudio) terminalAudio.playTap();
      const inputId = type === 'charge' ? 'chargeAmount' : 'topupAmount';
      const input = document.getElementById(inputId);
      let current = parseInt(input.value.replace(/\D/g, '') || '0', 10);
      current += amount;
      input.value = current.toLocaleString('ru-RU');
    }

    function createQrTransaction() {
      if (window.terminalAudio) terminalAudio.playTap();
      const amountVal = parseInt(document.getElementById('chargeAmount').value.replace(/\D/g, '') || '0', 10);
      if (amountVal <= 0) return;

      fetch('/api/create-transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: amountVal })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          renderQrView(data.transaction);
        }
      })
      .catch(err => console.error(err));
    }

    function renderQrView(tx) {
      document.getElementById('chargeFormView').style.display = 'none';
      document.getElementById('qrDisplayPanel').classList.add('active');
      document.getElementById('qrAmountDisplay').textContent = tx.amount.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('qrImage').src = tx.qrCode;
    }

    function cancelTransaction() {
      if (window.terminalAudio) terminalAudio.playTap();
      fetch('/api/cancel-transaction', { method: 'POST' }).catch(e => {});
      resetChargeView();
    }

    function resetChargeView() {
      if (window.terminalAudio) terminalAudio.playTap();
      document.getElementById('chargeAmount').value = '0';
      document.getElementById('chargeFormView').style.display = 'flex';
      document.getElementById('qrDisplayPanel').classList.remove('active');
      document.getElementById('paymentSuccessCard').classList.remove('active');
      document.getElementById('errorOverlay').classList.remove('active');
    }

    function submitTopup() {
      if (window.terminalAudio) terminalAudio.playTap();
      const amountVal = parseInt(document.getElementById('topupAmount').value.replace(/\D/g, '') || '0', 10);
      if (amountVal <= 0) return;

      fetch('/api/topup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: amountVal })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          if (window.terminalAudio) terminalAudio.playSuccess();
          clearInput('topup');
          switchTab('charge');
        }
      });
    }

    function closeErrorOverlay() {
      if (window.terminalAudio) terminalAudio.playTap();
      document.getElementById('errorOverlay').classList.remove('active');
      resetChargeView();
    }

    socket.on('payment_success', (data) => {
      if (window.terminalAudio) terminalAudio.playSuccess();
      document.getElementById('qrDisplayPanel').classList.remove('active');
      document.getElementById('paymentSuccessCard').classList.add('active');
      document.getElementById('successAmountText').textContent = data.transaction.amount.toLocaleString('ru-RU') + ' ₽';
    });

    socket.on('payment_failed', (data) => {
      if (window.terminalAudio) terminalAudio.playError();
      document.getElementById('qrDisplayPanel').classList.remove('active');
      document.getElementById('errorRequiredAmount').textContent = data.transaction.amount.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('errorOverlay').classList.add('active');
    });

    socket.on('transaction_cancelled', () => {
      resetChargeView();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const errOverlay = document.getElementById('errorOverlay');
        const successCard = document.getElementById('paymentSuccessCard');
        const qrPanel = document.getElementById('qrDisplayPanel');

        if (errOverlay.classList.contains('active')) {
          closeErrorOverlay();
        } else if (successCard.classList.contains('active')) {
          resetChargeView();
        } else if (qrPanel.classList.contains('active')) {
          // Waiting
        } else {
          if (currentTab === 'charge') createQrTransaction();
          else submitTopup();
        }
      } else if (e.key === 'Escape') {
        cancelTransaction();
      } else if (!isNaN(e.key)) {
        appendDigit(currentTab, e.key);
      } else if (e.key === 'Backspace') {
        backspace(currentTab);
      }
    });
  </script>
</body>
</html>
