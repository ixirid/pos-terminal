<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Терминал - Управление</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }

        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #16a34a;
        }

        .displays-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .display-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .display-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .display-name {
            font-weight: bold;
            font-size: 16px;
        }

        .display-id {
            font-size: 12px;
            color: #64748b;
        }

        .display-actions {
            display: flex;
            gap: 10px;
        }

        .btn-lock {
            background: #eab308;
            color: #000;
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-lock.locked {
            background: #ef4444;
            color: #fff;
        }

        .balance-box {
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Кассовый терминал</h1>

        <div class="card">
            <h2>Баланс счета</h2>
            <div class="balance-box" id="balanceDisplay">0.00 ₽</div>
            <button onclick="topUpBalance()">Пополнить баланс (+5000 ₽)</button>
        </div>

        <div class="card">
            <h2>Создать оплату</h2>
            <div class="form-group">
                <label for="amountInput">Сумма (₽)</label>
                <input type="number" id="amountInput" placeholder="Введите сумму" value="100">
            </div>
            <div class="form-group">
                <label for="targetDisplaySelect">Целевой дисплей</label>
                <select id="targetDisplaySelect">
                    <option value="">Все дисплеи (общий экран)</option>
                </select>
            </div>
            <button onclick="createTransaction()">Сгенерировать QR-код</button>
        </div>

        <div class="card">
            <h2>Подключенные дисплеи покупателя</h2>
            <div class="displays-list" id="displaysContainer">
                <div style="color: #64748b; text-align: center; padding: 10px;">Нет подключенных дисплеев</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // Загрузка начальных данных при старте
        async function loadInitialData() {
            try {
                const res = await fetch('/api/info');
                const data = await res.json();
                document.getElementById('balanceDisplay').textContent = data.balance.toLocaleString('ru-RU') + ' ₽';
                updateDisplaysList(data.displays);
            } catch (e) {
                console.error('Ошибка загрузки данных:', e);
            }
        }
        loadInitialData();

        // Обновление баланса в реальном времени
        socket.on('client_balance_updated', (data) => {
            document.getElementById('balanceDisplay').textContent = data.balance.toLocaleString('ru-RU') + ' ₽';
        });

        // Слушаем обновление списка дисплеев от сервера
        socket.on('update_displays', (displays) => {
            updateDisplaysList(displays);
        });

        function updateDisplaysList(displays) {
            const container = document.getElementById('displaysContainer');
            const select = document.getElementById('targetDisplaySelect');
            
            // Сохраняем выбранное ранее значение в выпадающем списке
            const currentSelected = select.value;
            select.innerHTML = '<option value="">Все дисплеи (общий экран)</option>';

            if (!displays || displays.length === 0) {
                container.innerHTML = '<div style="color: #64748b; text-align: center; padding: 10px;">Нет подключенных дисплеев</div>';
                return;
            }

            container.innerHTML = '';

            displays.forEach(d => {
                // Заполняем список дисплеев на экране
                const item = document.createElement('div');
                item.className = 'display-item';
                
                const isLocked = d.locked === true;

                item.innerHTML = `
                    <div class="display-info">
                        <span class="display-name">${d.name || 'Дисплей'}</span>
                        <span class="display-id">ID: ${d.id} | IP: ${d.ip || 'неизвестно'}</span>
                    </div>
                    <div class="display-actions">
                        <button class="btn-lock ${isLocked ? 'locked' : ''}" onclick="toggleLock('${d.id}', ${!isLocked})">
                            ${isLocked ? 'Разблокировать 🔓' : 'Заблокировать 🔒'}
                        </button>
                    </div>
                `;
                container.appendChild(item);

                // Добавляем в выпадающий список выбора кассы
                const option = document.createElement('option');
                option.value = d.id;
                option.textContent = `${d.name} (${d.id})`;
                select.appendChild(option);
            });

            if (currentSelected) {
                select.value = currentSelected;
            }
        }

        // Функция управления блокировкой (замком)
        function toggleLock(displayId, lockState) {
            // Отправляем запрос на сервер для изменения статуса замка конкретного дисплея
            socket.emit('set_display_lock', { id: displayId, isBlocked: lockState });
        }

        // Создание транзакции
        async function createTransaction() {
            const amount = document.getElementById('amountInput').value;
            const targetDisplayId = document.getElementById('targetDisplaySelect').value;

            if (!amount || amount <= 0) {
                alert('Введите корректную сумму');
                return;
            }

            try {
                const res = await fetch('/api/create-transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        amount: parseInt(amount, 10), 
                        targetDisplayId: targetDisplayId || null 
                    })
                });
                const data = await res.json();
                if (!data.success) {
                    alert('Ошибка создания транзакции');
                }
            } catch (e) {
                console.error('Ошибка запроса:', e);
            }
        }

        // Пополнение баланса для тестов
        async function topUpBalance() {
            try {
                await fetch('/api/topup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 5000 })
                });
            } catch (e) {
                console.error('Ошибка пополнения:', e);
            }
        }
    </script>
</body>
</html>
