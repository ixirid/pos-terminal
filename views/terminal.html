<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POS Терминал Кассы</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131b2e;
      --bg-card-hover: #1e293b;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Шапка */
    .pos-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-badge-online {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 20px;
      font-size: 13px;
      color: var(--primary);
    }

    .pulse-dot-green {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Главный контейнер */
    .pos-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: hidden;
    }

    .pos-main-panel {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 850px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    /* Вкладки */
    .tabs-header {
      display: flex;
      padding: 10px;
      gap: 8px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
    }

    .tab-content {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }

    .tab-content.active {
      display: flex;
    }

    /* Экран суммы */
    .amount-display-wrapper {
      text-align: center;
      margin-bottom: 12px;
    }

    .amount-label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .amount-input-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 4px;
    }

    .amount-input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 36px;
      font-weight: 800;
      text-align: right;
      width: 200px;
      outline: none;
    }

    .amount-currency {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
    }

    /* Быстрые кнопки */
    .quick-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .preset-btn {
      padding: 10px 4px;
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .preset-btn:hover {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--primary);
    }

    /* Нумпад с большими кнопками */
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex: 1;
      margin-bottom: 12px;
    }

    .num-btn {
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 24px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.05s;
      user-select: none;
      min-height: 52px;
    }

    .num-btn:active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.15);
    }

    .num-btn.clear { color: var(--error); }
    .num-btn.action { color: var(--primary); }

    /* Основная кнопка действия */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* QR Панель, Успех, Ошибки (скрыты по умолчанию) */
    .qr-display-panel, .success-card, .error-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    .qr-display-panel.active, .success-card.active, .error-overlay.active {
      display: flex;
    }

    .qr-box {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      margin: 16px 0;
    }

    .qr-box img {
      width: 180px;
      height: 180px;
      display: block;
    }

    .check-icon-circle, .error-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    .check-icon-circle { background: rgba(34, 197, 94, 0.2); color: var(--primary); }
    .error-circle { background: rgba(239, 68, 68, 0.2); color: var(--error); }

    /* Медиа-запрос для ПК: делаем терминал чуть просторнее на больших экранах */
    @media (min-width: 768px) {
      .pos-main-panel {
        max-width: 520px;
        max-height: 900px;
      }
      .num-btn {
        min-height: 60px;
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- Верхняя панель кассира -->
  <header class="pos-header">
    <div class="brand-title">
      <div class="brand-icon">Б</div>
      <div class="brand-text">
        <h1>POS Terminal</h1>
        <p id="serverInfoText">Система активна</p>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="/display" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.35); color: #22c55e; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 600;">
        <span>📺 Клиент</span>
      </a>
      <div class="status-badge-online">
        <span class="pulse-dot-green"></span>
        <span>Онлайн</span>
      </div>
    </div>
  </header>

  <!-- Главный контейнер терминала -->
  <main class="pos-container">
    <section class="pos-main-panel">
      <!-- Навигация Вкладок -->
      <nav class="tabs-header">
        <button class="tab-btn active" id="tabBtnCharge" onclick="switchTab('charge')">
          💸 Оплата
        </button>
        <button class="tab-btn" id="tabBtnTopup" onclick="switchTab('topup')">
          ➕ Пополнить
        </button>
      </nav>

      <!-- Вкладка 1: Оплата -->
      <div class="tab-content active" id="tabCharge">
        <div id="chargeFormView" style="display: flex; flex-direction: column; height: 100%;">
          <div class="amount-display-wrapper">
            <span class="amount-label">Сумма к оплате</span>
            <div class="amount-input-container">
              <input type="text" id="chargeAmount" class="amount-input" value="0" readonly>
              <span class="amount-currency">₽</span>
            </div>
          </div>

          <div class="quick-presets">
            <button class="preset-btn" onclick="addPreset('charge', 100)">+100</button>
            <button class="preset-btn" onclick="addPreset('charge', 500)">+500</button>
            <button class="preset-btn" onclick="addPreset('charge', 1000)">+1K</button>
            <button class="preset-btn" onclick="addPreset('charge', 5000)">+5K</button>
          </div>

          <!-- Нумпад -->
          <div class="numpad-grid">
            <button class="num-btn" onclick="appendDigit('charge', '1')">1</button>
            <button class="num-btn" onclick="appendDigit('charge', '2')">2</button>
            <button class="num-btn" onclick="appendDigit('charge', '3')">3</button>
            <button class="num-btn" onclick="appendDigit('charge', '4')">4</button>
            <button class="num-btn" onclick="appendDigit('charge', '5')">5</button>
            <button class="num-btn" onclick="appendDigit('charge', '6')">6</button>
            <button class="num-btn" onclick="appendDigit('charge', '7')">7</button>
            <button class="num-btn" onclick="appendDigit('charge', '8')">8</button>
            <button class="num-btn" onclick="appendDigit('charge', '9')">9</button>
            <button class="num-btn clear" onclick="clearInput('charge')">C</button>
            <button class="num-btn" onclick="appendDigit('charge', '0')">0</button>
            <button class="num-btn action" onclick="backspace('charge')">⌫</button>
          </div>

          <button class="btn-primary" onclick="createQrTransaction()">
            Сгенерировать QR
          </button>
        </div>

        <!-- Режим Отображения QR-кода -->
        <div class="qr-display-panel" id="qrDisplayPanel">
          <h2 style="font-size: 20px; margin-bottom: 8px;">К оплате: <span id="qrAmountDisplay" style="color: var(--primary);">0 ₽</span></h2>
          <div class="qr-box">
            <img id="qrImage" src="" alt="QR-код оплаты">
          </div>
          <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
            Отсканируйте камерой смартфона
          </p>
          <button class="btn-primary" onclick="cancelTransaction()" style="background: var(--bg-card-hover); border: 1px solid var(--border);">
            Отменить
          </button>
        </div>

        <!-- Успешная Оплата -->
        <div class="success-card" id="paymentSuccessCard">
          <div class="check-icon-circle">✓</div>
          <h2 style="font-size: 22px; margin-bottom: 8px;">Оплачено!</h2>
          <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 8px;">
            Сумма: <strong id="successAmountText" style="color: #fff;">0 ₽</strong>
          </p>
          <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;" id="successBalanceWrapper">
            Остаток: <strong id="successBalanceText" style="color: var(--primary);">0 ₽</strong>
          </p>
          <button class="btn-primary" onclick="resetChargeView()">
            Новая операция (<span id="successCountdown">7</span>)
          </button>
        </div>
      </div>

      <!-- Вкладка 2: Пополнение -->
      <div class="tab-content" id="tabTopup">
        <div style="display: flex; flex-direction: column; height: 100%;">
          <div class="amount-display-wrapper">
            <span class="amount-label">Сумма пополнения</span>
            <div class="amount-input-container">
              <input type="text" id="topupAmount" class="amount-input" value="0" readonly>
              <span class="amount-currency">₽</span>
            </div>
          </div>

          <div class="quick-presets">
            <button class="preset-btn" onclick="addPreset('topup', 100)">+100</button>
            <button class="preset-btn" onclick="addPreset('topup', 500)">+500</button>
            <button class="preset-btn" onclick="addPreset('topup', 1000)">+1K</button>
            <button class="preset-btn" onclick="addPreset('topup', 5000)">+5K</button>
          </div>

          <!-- Нумпад -->
          <div class="numpad-grid">
            <button class="num-btn" onclick="appendDigit('topup', '1')">1</button>
            <button class="num-btn" onclick="appendDigit('topup', '2')">2</button>
            <button class="num-btn" onclick="appendDigit('topup', '3')">3</button>
            <button class="num-btn" onclick="appendDigit('topup', '4')">4</button>
            <button class="num-btn" onclick="appendDigit('topup', '5')">5</button>
            <button class="num-btn" onclick="appendDigit('topup', '6')">6</button>
            <button class="num-btn" onclick="appendDigit('topup', '7')">7</button>
            <button class="num-btn" onclick="appendDigit('topup', '8')">8</button>
            <button class="num-btn" onclick="appendDigit('topup', '9')">9</button>
            <button class="num-btn clear" onclick="clearInput('topup')">C</button>
            <button class="num-btn" onclick="appendDigit('topup', '0')">0</button>
            <button class="num-btn action" onclick="backspace('topup')">⌫</button>
          </div>

          <button class="btn-primary" onclick="submitTopup()">
            Внести на счет
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Оверлей ошибки -->
  <div class="error-overlay" id="errorOverlay">
    <div class="error-circle">✕</div>
    <h2>Ошибка оплаты</h2>
    <p class="error-subtitle" style="color: var(--text-muted); margin: 8px 0 16px 0;">Недостаточно средств на балансе карты!</p>
    <div class="error-details" style="margin-bottom: 20px; font-size: 15px;">
      <div>Требуется: <span id="errorRequiredAmount" style="color: var(--error); font-weight: 700;">0 ₽</span></div>
      <div>Доступно: <span id="errorAvailableBalance" style="color: var(--primary); font-weight: 700;">0 ₽</span></div>
    </div>
    <button class="btn-primary" onclick="closeErrorOverlay()" style="background: var(--error); max-width: 280px;">
      Закрыть
    </button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/audio.js"></script>
  <script src="/js/terminal.js"></script>
</body>
</html>
