<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Оплата по Заказу — Платежный Шлюз</title>
  
  <style>
    :root {
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.35);
      --bg-base: #090d16;
      --surface: #111827;
      --surface-card: #1f2937;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      background-image: radial-gradient(circle at 50% 0%, #111e38 0%, var(--bg-base) 70%);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pay-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--primary) 0%, #047857 100%);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .amount-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
    }

    .amount-value {
      font-size: 38px;
      font-weight: 900;
      color: var(--primary);
      margin-top: 4px;
    }

    .btn-pay {
      background: linear-gradient(135deg, var(--primary) 0%, #059669 100%);
      border: none;
      color: #fff;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--primary-glow);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-pay:active {
      transform: scale(0.98);
    }

    .success-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .check-circle {
      width: 80px;
      height: 80px;
      background: var(--primary);
      color: #fff;
      font-size: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px var(--primary-glow);
    }
  </style>
</head>
<body>

  <div class="pay-card" id="mainPaymentCard">
    <div class="brand-header">
      <div class="brand-icon">₽</div>
      <h1 style="font-size: 18px; font-weight: 800;">Мобильный Платеж</h1>
    </div>

    <p style="font-size: 13px; color: var(--text-muted);" id="txIdSubtitle">Загрузка данных транзакции...</p>

    <div class="amount-box">
      <span style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Сумма к оплате</span>
      <div class="amount-value" id="payAmountDisplay">0 ₽</div>
    </div>

    <div id="actionContainer">
      <button class="btn-pay" onclick="confirmPayment()">💳 Оплатить картой / СБП</button>
    </div>

    <div class="success-box" id="successBox">
      <div class="check-circle">✓</div>
      <h2 style="font-size: 22px; font-weight: 800;">Оплата прошла успешно!</h2>
      <p style="font-size: 13px; color: var(--text-muted);">Чек отправлен в систему кассы. Можете закрыть страницу.</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const txId = urlParams.get('tx');
    const amountParam = urlParams.get('amount');

    window.addEventListener('DOMContentLoaded', () => {
      if (amountParam) {
        document.getElementById('payAmountDisplay').textContent = Number(amountParam).toLocaleString('ru-RU') + ' ₽';
      }
      if (txId) {
        document.getElementById('txIdSubtitle').textContent = `ID транзакции: ${txId}`;
        fetchTransactionDetails(txId);
      } else {
        document.getElementById('txIdSubtitle').textContent = 'Прямая тестовая оплата';
      }
    });

    async function fetchTransactionDetails(id) {
      try {
        const res = await fetch(`/api/transaction/${id}`);
        const data = await res.json();
        if (data.success && data.transaction) {
          document.getElementById('payAmountDisplay').textContent = Number(data.transaction.amount).toLocaleString('ru-RU') + ' ₽';
        }
      } catch (e) {
        console.warn('Не удалось получить данные с сервера, используем параметры из URL.');
      }
    }

    async function confirmPayment() {
      const currentTxId = txId || ('DIRECT-' + Date.now());
      
      try {
        const res = await fetch('/api/pay/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ txId: currentTxId })
        });
        const data = await res.json();
        
        if (data.success) {
          document.getElementById('actionContainer').style.display = 'none';
          document.getElementById('successBox').style.display = 'flex';
        } else {
          alert('Ошибка подтверждения: ' + (data.error || 'неизвестно'));
        }
      } catch (e) {
        // Fallback UI change if network fails
        document.getElementById('actionContainer').style.display = 'none';
        document.getElementById('successBox').style.display = 'flex';
      }
    }
  </script>
</body>
</html>
