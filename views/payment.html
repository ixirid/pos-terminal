<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение оплаты</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #090d16; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .box { background: #111827; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 32px; width: 100%; max-width: 400px; text-align: center; }
    .btn { background: linear-gradient(135deg, #10b981, #059669); border: none; color: #fff; width: 100%; padding: 16px; border-radius: 14px; font-size: 18px; font-weight: 800; margin-top: 20px; cursor: pointer; }
    .btn-sec { background: #374151; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="box" id="payBox">
    <h2>Оплата счета</h2>
    <p style="color: #9ca3af; margin-top: 8px;">Код транзакции: <span id="txIdText">...</span></p>
    <button class="btn" onclick="processPay()">Подтвердить и оплатить</button>
  </div>

  <div class="box" id="resultBox" style="display: none;">
    <div style="font-size: 60px; color: #10b981;">✓</div>
    <h2>Успешно оплачено!</h2>
    <button class="btn btn-sec" onclick="window.location.href='/client'">Вернуться в кабинет</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const txId = urlParams.get('tx');
    document.getElementById('txIdText').textContent = txId || 'Не указан';

    function processPay() {
      fetch('/api/pay-qr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ txId })
      }).then(r => r.json()).then(data => {
        if (data.success) {
          document.getElementById('payBox').style.display = 'none';
          document.getElementById('resultBox').style.display = 'block';
        } else {
          alert(data.message || 'Ошибка оплаты');
        }
      });
    }
  </script>
</body>
</html>
