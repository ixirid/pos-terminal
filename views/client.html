<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет Клиента</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #090d16; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    .card {
      width: 100%; max-width: 400px; background: linear-gradient(135deg, #10b981, #047857);
      border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(16,185,129,0.3); margin-top: 20px;
    }
    .balance-val { font-size: 36px; font-weight: 900; margin-top: 10px; }

    .scan-btn {
      width: 100%; max-width: 400px; margin-top: 30px; padding: 20px; background: #1f2937;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #fff; font-size: 18px;
      font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
    }
  </style>
</head>
<body>

  <h2>Портал Клиента</h2>

  <div class="card">
    <div style="opacity: 0.8; font-size: 14px;">Ваш баланс</div>
    <div class="balance-val" id="balanceDisplay">0 ₽</div>
    <div style="margin-top: 20px; font-size: 12px; opacity: 0.6;">Карта: **** 3456</div>
  </div>

  <button class="scan-btn" onclick="openScanner()">
    📷 Отсканировать QR-код
  </button>

  <script>
    function updateBalance() {
      fetch('/api/info').then(r => r.json()).then(d => {
        document.getElementById('balanceDisplay').textContent = d.balance.toLocaleString('ru-RU') + ' ₽';
      });
    }

    function openScanner() {
      const tx = prompt("Введите код транзакции с экрана (например, TX-XXXXXX) или подтвердите переход к сканеру:");
      if (tx) {
        window.location.href = '/pay?tx=' + tx;
      }
    }

    updateBalance();
  </script>
</body>
</html>
