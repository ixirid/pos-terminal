<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Портал Клиента — SberPay</title>
  <script src="/socket.io/socket.io.js"></script>
  <!-- Подключаем библиотеку для сканирования QR-кодов через камеру -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    :root {
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.35);
      --primary-dark: #059669;
      --bg-base: #090d16;
      --surface: #111827;
      --surface-card: #1f2937;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      background-image: radial-gradient(circle at 50% 0%, #111e38 0%, var(--bg-base) 70%);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .portal-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: auto 0;
    }

    .card-balance-box {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .balance-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-amount {
      font-size: 42px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 2px 10px var(--primary-glow);
    }

    .scan-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      color: #fff;
      padding: 18px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .scan-btn:active {
      transform: scale(0.97);
    }

    /* СКАНЕР КАМЕРЫ НА ВЕСЬ ЭКРАН */
    .scanner-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px;
    }

    .scanner-overlay.active {
      display: flex !important;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--primary);
    }

    .back-home-btn {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="portal-container" id="portalMainView">
    <div style="text-align: center; margin-bottom: 8px;">
      <h1 style="font-size: 22px; font-weight: 900; color: #fff;">SberPay Портал Клиента</h1>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">Управление балансом и быстрая оплата</p>
    </div>

    <div class="card-balance-box">
      <span class="balance-label">Баланс вашей карты</span>
      <div class="balance-amount" id="clientBalanceDisplay">0 ₽</div>
    </div>

    <button class="scan-btn" onclick="openScanner()">
      📷 Отсканировать QR-код для оплаты
    </button>
  </div>

  <!-- Сканер камера модалка -->
  <div class="scanner-overlay" id="scannerOverlay">
    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
      <h2 style="font-size: 18px; color: #fff;">Сканирование QR-кода</h2>
      <button onclick="closeScanner()" style="background: rgba(255,255,255,0.1); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer;">✕</button>
    </div>
    
    <div id="reader"></div>

    <p style="color: var(--text-muted); font-size: 14px; text-align: center;">Наведите камеру на QR-код оплаты на терминале</p>
  </div>

  <script>
    const socket = io();
    let html5QrCode = null;

    // Функция для красивого отображения суммы в рублях
    function formatCurrency(num) {
      return num.toLocaleString('ru-RU', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }) + ' ₽';
    }

    // 1. Загрузка баланса при первом открытии страницы
    fetch('/api/shortcut/test')
      .then(res => res.json())
      .then(data => {
        if (data.currentBalance !== undefined) {
          document.getElementById('clientBalanceDisplay').textContent = formatCurrency(data.currentBalance);
        }
      })
      .catch(err => console.error('Ошибка загрузки баланса:', err));

    // 2. Получение актуального состояния от сервера при подключении/обновлении
    socket.on('init_state', (data) => {
      if (data.balance !== undefined) {
        document.getElementById('clientBalanceDisplay').textContent = formatCurrency(data.balance);
      }
    });

    // 3. Обновление баланса в реальном времени при пополнении
    socket.on('balance_updated', (data) => {
      if (data.newBalance !== undefined) {
        document.getElementById('clientBalanceDisplay').textContent = formatCurrency(data.newBalance);
      }
    });

    // 4. Обновление баланса и закрытие камеры после успешной оплаты
    socket.on('payment_success', (data) => {
      if (data.newBalance !== undefined) {
        document.getElementById('clientBalanceDisplay').textContent = formatCurrency(data.newBalance);
      }
      closeScanner();
    });

    // Управление камерой и сканером QR-кодов
    function openScanner() {
      document.getElementById('scannerOverlay').classList.add('active');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText, decodedResult) => {
          if (decodedText.includes('/pay/')) {
            closeScanner();
            window.location.href = decodedText;
          }
        },
        (errorMessage) => {
          // Ошибки поиска QR в кадре можно игнорировать
        }
      ).catch(err => {
        alert("Не удалось запустить камеру. Проверьте разрешения браузера.");
        closeScanner();
      });
    }

    function closeScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
        }).catch(err => {});
      }
      document.getElementById('scannerOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
