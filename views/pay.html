<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Оплата Счета</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body style="background: #121214;">

  <div class="mobile-pay-container">
    <div class="client-card" id="clientCard">
      <!-- Идет загрузка -->
      <div id="loadingView">
        <div class="pulse-dot" style="margin: 0 auto 16px auto; width: 16px; height: 16px;"></div>
        <p style="color: var(--text-muted);">Загрузка сведений о платеже...</p>
      </div>

      <!-- Карточка Оплаты -->
      <div id="payFormView" style="display: none;">
        <div style="font-size: 13px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px;">
          Терминал Оплаты
        </div>

        <!-- Отображение Текущего Баланса Клиента -->
        <div class="client-balance-badge" id="clientBalanceBadge">
          <span>Ваш доступный баланс:</span>
          <strong id="clientBalanceVal">0 ₽</strong>
        </div>

        <div class="client-amount-box">
          <span style="font-size: 13px; color: var(--text-muted);">Сумма к списанию</span>
          <div class="client-amount-val" id="payAmountDisplay">0 ₽</div>
        </div>

        <div id="insufficientWarning" class="warning-banner" style="display: none;">
          ⚠️ Недостаточно средств на балансе
        </div>

        <button class="btn-primary" id="payBtn" onclick="confirmPayment()">
          Подтвердить и оплатить
        </button>
      </div>

      <!-- Состояние Успеха -->
      <div id="successView" style="display: none; animation: scaleUp 0.3s ease;">
        <div class="check-icon-circle" style="margin: 0 auto 20px auto;">✓</div>
        <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">Оплачено!</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Спасибо за покупку</p>
        <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); padding: 12px; border-radius: 12px; color: #6ee7b7; font-weight: 600; font-size: 14px;">
          Транзакция завершена успешно
        </div>
      </div>

      <!-- Состояние Ошибки -->
      <div id="errorView" style="display: none;">
        <div style="width: 70px; height: 70px; background: rgba(239, 68, 68, 0.15); color: var(--error); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; margin: 0 auto 16px auto;">✕</div>
        <h3 id="errorTitle" style="font-size: 20px; margin-bottom: 8px;">Ошибка оплаты</h3>
        <p id="errorMessage" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;"></p>
        <button class="btn-secondary" onclick="loadTransaction()">Обновить статус</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const transactionId = window.location.pathname.split('/').pop();

    let transactionData = null;

    async function loadTransaction() {
      try {
        document.getElementById('errorView').style.display = 'none';
        document.getElementById('loadingView').style.display = 'block';

        const res = await fetch(`/api/transaction/${transactionId}`);
        const data = await res.json();

        document.getElementById('loadingView').style.display = 'none';

        if (!res.ok || !data.found) {
          showError('Транзакция не найдена', data.error || 'Ссылка недействительна или срок действия истек');
          return;
        }

        transactionData = data.transaction;

        if (transactionData.status === 'paid') {
          showSuccess();
          return;
        }

        if (transactionData.status === 'cancelled') {
          showError('Транзакция отменена', 'Оператор терминала отменил запрос оплаты.');
          return;
        }

        document.getElementById('payFormView').style.display = 'block';
        document.getElementById('payAmountDisplay').innerText = `${transactionData.amount.toLocaleString('ru-RU')} ₽`;
        document.getElementById('clientBalanceVal').innerText = `${data.clientBalance.toLocaleString('ru-RU')} ₽`;

        // Проверка достаточности средств
        const payBtn = document.getElementById('payBtn');
        const warnBanner = document.getElementById('insufficientWarning');

        if (!data.balanceAvailable) {
          warnBanner.style.display = 'block';
          payBtn.disabled = true;
          payBtn.style.opacity = '0.5';
          payBtn.style.cursor = 'not-allowed';
          payBtn.innerText = 'Недостаточно средств';
        } else {
          warnBanner.style.display = 'none';
          payBtn.disabled = false;
          payBtn.style.opacity = '1';
          payBtn.style.cursor = 'pointer';
          payBtn.innerText = 'Подтвердить и оплатить';
        }

      } catch (err) {
        document.getElementById('loadingView').style.display = 'none';
        showError('Ошибка подключения', 'Не удалось связаться с сервером терминала.');
      }
    }

    async function confirmPayment() {
      const btn = document.getElementById('payBtn');
      btn.disabled = true;
      btn.innerText = 'Обработка...';

      try {
        const res = await fetch(`/api/pay/${transactionId}`, {
          method: 'POST'
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showSuccess();
        } else {
          btn.disabled = false;
          btn.innerText = 'Подтвердить и оплатить';
          showError('Ошибка проведения платежа', data.error || 'Списание не удалось');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = 'Подтвердить и оплатить';
        showError('Сбой сети', 'Проверьте соединение с интернетом');
      }
    }

    function showSuccess() {
      document.getElementById('payFormView').style.display = 'none';
      document.getElementById('errorView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    }

    function showError(title, msg) {
      document.getElementById('payFormView').style.display = 'none';
      document.getElementById('errorView').style.display = 'block';
      document.getElementById('errorTitle').innerText = title;
      document.getElementById('errorMessage').innerText = msg;
    }

    // Слушаем отмену с терминала
    socket.on('transaction_cancelled', (data) => {
      if (data.id === transactionId) {
        showError('Транзакция отменена', 'Операция была отменена на терминале.');
      }
    });

    loadTransaction();
  </script>
</body>
</html>
