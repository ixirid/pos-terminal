<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Оплата по QR-коду — SberPay</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.35);
      --primary-dark: #059669;
      --error: #ef4444;
      --bg-base: #090d16;
      --surface: #111827;
      --surface-card: #1f2937;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      background-image: radial-gradient(circle at 50% 0%, #111e38 0%, var(--bg-base) 70%);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pay-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .amount-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .amount-value {
      font-size: 38px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 20px;
    }

    .btn-pay {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      color: #fff;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 25px var(--primary-glow);
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .btn-pay:active {
      transform: scale(0.98);
    }

    .back-home-btn {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="pay-card" id="payCardContainer">
    <div class="amount-title">Сумма к оплате</div>
    <div class="amount-value" id="txAmount">0 ₽</div>
    
    <div id="clientBalanceInfo" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
      Баланс на карте: <strong id="clientBalanceVal" style="color: #fff;">0 ₽</strong>
    </div>

    <button class="btn-pay" id="payBtn" onclick="confirmPayment()">Подтвердить оплату</button>
    <a href="/client" class="back-home-btn">← Вернуться на главную портала</a>
  </div>

  <script>
    // Извлекаем txId из параметров URL (?tx=... или ?id=...)
    const urlParams = new URLSearchParams(window.location.search);
    const txId = urlParams.get('tx') || urlParams.get('id');

    if (!txId) {
      showError('Некорректная ссылка на оплату');
    } else {
      loadTransactionData();
    }

    function loadTransactionData() {
      fetch(`/api/transaction/${txId}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.transaction) {
            if (data.transaction.status !== 'pending') {
              showError('Транзакция уже обработана или отменена');
              return;
            }

            document.getElementById('txAmount').textContent = data.transaction.amount.toLocaleString('ru-RU') + ' ₽';
            if (data.balance !== undefined) {
              document.getElementById('clientBalanceVal').textContent = data.balance.toLocaleString('ru-RU') + ' ₽';
            }
          } else {
            showError('Транзакция не найдена или истекла');
          }
        })
        .catch(e => {
          showError('Ошибка загрузки данных о платеже');
        });
    }

    function confirmPayment() {
      if (!txId) return;

      const btn = document.getElementById('payBtn');
      btn.disabled = true;
      btn.textContent = 'Обработка...';

      fetch('/api/process-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ txId })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById('payCardContainer').innerHTML = `
            <div style="font-size: 50px; color: var(--primary); margin-bottom: 12px;">✓</div>
            <h2 style="font-size: 24px; color: #fff; margin-bottom: 8px;">Оплата успешна!</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Остаток на карте: <strong style="color: var(--primary);">${(data.newBalance || 0).toLocaleString('ru-RU')} ₽</strong></p>
            <a href="/client" class="back-home-btn" style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff;">Вернуться в портал</a>
          `;
        } else {
          const errMsg = data.error === 'insufficient_funds' ? 'Недостаточно средств на балансе' : (data.error || 'Ошибка оплаты');
          alert(errMsg);
          btn.disabled = false;
          btn.textContent = 'Подтвердить оплату';
        }
      })
      .catch(err => {
        alert('Ошибка связи с сервером');
        btn.disabled = false;
        btn.textContent = 'Подтвердить оплату';
      });
    }

    function showError(msg) {
      document.getElementById('payCardContainer').innerHTML = `
        <div style="font-size: 40px; color: var(--error); margin-bottom: 12px;">✕</div>
        <h2 style="color: #fff; font-size: 18px; margin-bottom: 16px;">${msg}</h2>
        <a href="/client" class="back-home-btn">На главную</a>
      `;
    }
  </script>
</body>
</html>
