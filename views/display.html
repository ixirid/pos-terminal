<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sber POS Display</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        body {
            background: #08140c;
            background: radial-gradient(circle at 50% 30%, #112d1b 0%, #060e08 100%);
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .display-card {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 840px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #22c55e;
            letter-spacing: 0.5px;
        }

        .state-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
        }

        .state {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .state.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* --- СОСТОЯНИЕ 1: ЗАСТАВКА (СМАЙЛИК СБЕРА) --- */
        .sber-avatar {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #22c55e 0%, #10b981 50%, #059669 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.35);
            animation: pulse-avatar 3.5s ease-in-out infinite;
            margin-bottom: 32px;
        }

        .sber-avatar .eye {
            width: 16px;
            height: 16px;
            background-color: #060e08;
            border-radius: 50%;
            position: absolute;
            top: 40px;
        }

        .sber-avatar .eye.left { left: 36px; }
        .sber-avatar .eye.right { right: 36px; }

        .sber-avatar .smile {
            width: 56px;
            height: 28px;
            border-bottom: 8px solid #060e08;
            border-radius: 0 0 50px 50px;
            position: absolute;
            bottom: 30px;
            left: 37px;
        }

        .idle-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            text-align: center;
        }

        .idle-subtitle {
            font-size: 15px;
            color: #9ca3af;
            text-align: center;
        }

        /* --- СОСТОЯНИЕ 2: ОПЛАТА (СУММА, QR, NFC) --- */
        .amount-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .amount-value {
            font-size: 52px;
            font-weight: 800;
            color: #22c55e;
            margin-bottom: 32px;
            letter-spacing: -1px;
        }

        .payment-methods {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-wrapper img {
            width: 190px;
            height: 190px;
            display: block;
            border-radius: 8px;
        }

        .pay-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 80%;
            color: #6b7280;
            font-size: 13px;
        }

        .pay-divider::before, .pay-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* АНИМАЦИЯ КАРТЫ И NFC ВОЛН */
        .nfc-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nfc-waves {
            width: 48px;
            height: 48px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wave-ring {
            position: absolute;
            border: 2px solid #22c55e;
            border-radius: 50%;
            animation: wave-ripple 2s infinite ease-out;
            opacity: 0;
        }

        .wave-ring:nth-child(1) { animation-delay: 0s; }
        .wave-ring:nth-child(2) { animation-delay: 0.6s; }
        .wave-ring:nth-child(3) { animation-delay: 1.2s; }

        .card-icon {
            font-size: 28px;
            z-index: 2;
        }

        .nfc-text {
            font-size: 15px;
            font-weight: 500;
            color: #e5e7eb;
        }

        /* --- СОСТОЯНИЕ 3: УСПЕХ (ГАЛОЧКА) --- */
        .success-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
        }

        .checkmark-svg {
            width: 64px;
            height: 64px;
            stroke: #22c55e;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .checkmark-path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw-check 0.6s ease-in-out forwards 0.1s;
        }

        .success-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .success-subtitle {
            font-size: 16px;
            color: #9ca3af;
        }

        .footer-note {
            font-size: 12px;
            color: #4b5563;
            text-align: center;
        }

        /* КЕЙФРЕЙМЫ АНИМАЦИЙ */
        @keyframes pulse-avatar {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(34, 197, 94, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(34, 197, 94, 0.5); }
        }

        @keyframes wave-ripple {
            0% { width: 16px; height: 16px; opacity: 1; }
            100% { width: 56px; height: 56px; opacity: 0; }
        }

        @keyframes draw-check {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>

    <div class="display-card">
        <!-- Шапка -->
        <div class="header-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            SBER POS
        </div>

        <!-- Состояния дисплея -->
        <div class="state-container">
            
            <!-- 1. Главный экран (Заставка) -->
            <div id="state-idle" class="state active">
                <div class="sber-avatar">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="smile"></div>
                </div>
                <div class="idle-title">Готов к оплате</div>
                <div class="idle-subtitle">Приложите карту или сканируйте QR-код</div>
            </div>

            <!-- 2. Экран оплаты -->
            <div id="state-pay" class="state">
                <div class="amount-label">К оплате</div>
                <div id="pay-amount" class="amount-value">0 ₽</div>
                
                <div class="payment-methods">
                    <div class="qr-wrapper">
                        <img id="qr-image" src="" alt="QR для оплаты">
                    </div>

                    <div class="pay-divider">или</div>

                    <div class="nfc-area">
                        <div class="nfc-waves">
                            <div class="wave-ring"></div>
                            <div class="wave-ring"></div>
                            <div class="wave-ring"></div>
                            <span class="card-icon">💳</span>
                        </div>
                        <div class="nfc-text">Приложите карту</div>
                    </div>
                </div>
            </div>

            <!-- 3. Экран успешной оплаты -->
            <div id="state-success" class="state">
                <div class="success-circle">
                    <svg class="checkmark-svg" viewBox="0 0 52 52">
                        <path class="checkmark-path" d="M14 27 l8 8 l16 -16"/>
                    </svg>
                </div>
                <div class="success-title">Оплата прошла</div>
                <div class="success-subtitle">Спасибо за покупку!</div>
            </div>

        </div>

        <!-- Подвал -->
        <div class="footer-note">Быстрая и безопасная оплата</div>
    </div>

    <script>
        const socket = io();

        const stateIdle = document.getElementById('state-idle');
        const statePay = document.getElementById('state-pay');
        const stateSuccess = document.getElementById('state-success');
        
        const payAmount = document.getElementById('pay-amount');
        const qrImage = document.getElementById('qr-image');

        function switchState(targetState) {
            [stateIdle, statePay, stateSuccess].forEach(el => el.classList.remove('active'));
            targetState.classList.add('active');
        }

        // Первоначальная инициализация при подключении
        socket.on('init_state', (data) => {
            if (data.activeTransaction && data.activeTransaction.status === 'pending') {
                renderPayState(data.activeTransaction);
            } else {
                switchState(stateIdle);
            }
        });

        // Создание транзакции с кассы
        socket.on('transaction_created', (tx) => {
            renderPayState(tx);
        });

        // Отрисовка данных для оплаты
        function renderPayState(tx) {
            payAmount.textContent = `${parseFloat(tx.amount).toLocaleString('ru-RU')} ₽`;
            qrImage.src = tx.qrCode;
            switchState(statePay);
        }

        // Успешная оплата
        socket.on('payment_success', () => {
            switchState(stateSuccess);
            setTimeout(() => {
                switchState(stateIdle);
            }, 3500);
        });

        // Отмена транзакции или ошибка
        socket.on('transaction_cancelled', () => {
            switchState(stateIdle);
        });

        socket.on('payment_failed', () => {
            switchState(stateIdle);
        });
    </script>
</body>
</html>
