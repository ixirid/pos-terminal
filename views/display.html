<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дисплей покупателя</title>
  <!-- Подключаем Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Подключаем Socket.io клиент через CDN для гарантированной работы на любом POS-терминале -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg-dark: #000000;
      --char-green: #00FF66;
      --char-pink: #FF3366;
      --char-purple: #9D00FF;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Фоновый переливающийся градиент */
    .ambient-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.14) 0%, rgba(157, 0, 255, 0.07) 45%, transparent 85%);
      animation: ambientPulse 8s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow.error-mode {
      background: radial-gradient(circle at 50% 50%, rgba(255, 51, 102, 0.2) 0%, rgba(157, 0, 255, 0.08) 45%, transparent 85%);
    }

    @keyframes ambientPulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    /* Слои отображения (Экраны) */
    .view-layer {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .view-layer.active {
      display: flex;
      opacity: 1;
    }

    /* Шапка дисплея */
    .display-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 28px;
      z-index: 50;
    }

    .pay-secret-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 18px;
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .pay-secret-badge:active {
      transform: scale(0.94);
      background: rgba(0, 255, 102, 0.2);
      border-color: var(--char-green);
    }

    .pay-dot {
      width: 10px;
      height: 10px;
      background-color: var(--char-green);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--char-green);
    }

    /* Персонаж (Глазки) */
    .character-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      width: 100%;
      max-width: 600px;
      padding: 0 20px;
    }

    .eyes-row {
      display: flex;
      gap: 36px;
      align-items: center;
      justify-content: center;
      height: 120px;
      filter: drop-shadow(0 0 24px rgba(0, 255, 102, 0.45));
    }

    .neon-eye {
      width: 125px;
      height: 96px;
      background-color: var(--char-green);
      border-radius: 42px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.4), 0 0 35px var(--char-green);
    }

    .neon-eye::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 18px;
      width: 24px;
      height: 12px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 6px;
    }

    .neon-eye.wink {
      height: 14px;
      border-radius: 7px;
      box-shadow: 0 0 25px var(--char-green);
    }

    .neon-eye.wink::after {
      display: none;
    }

    .neon-eye.heart {
      background-color: transparent !important;
      box-shadow: none !important;
      width: 130px;
      height: 120px;
    }

    .neon-eye.heart::after {
      display: none;
    }

    .neon-eye.heart svg {
      width: 100%;
      height: 100%;
      fill: var(--char-pink);
      filter: drop-shadow(0 0 20px var(--char-pink));
      animation: heartBeat 1.2s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .neon-eye.pink-glow {
      background-color: var(--char-pink);
      box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.4), 0 0 35px var(--char-pink);
    }

    /* Контейнер реплик */
    .speech-box {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .speech-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    .speech-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.35;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
    }

    /* Карточка счёта (QR) */
    .invoice-card {
      background: rgba(25, 25, 30, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 40px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    /* --- ЭКРАНЫ СТАТУСА ОПЛАТЫ --- */
    .status-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .pay-anim-box {
      width: 160px;
      height: 160px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .anim-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .circle-path {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 340;
      stroke-dashoffset: 340;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .success-circle-path {
      stroke: var(--char-green);
      filter: drop-shadow(0 0 16px rgba(0, 255, 102, 0.6));
    }

    .error-circle-path {
      stroke: var(--char-pink);
      filter: drop-shadow(0 0 16px rgba(255, 51, 102, 0.6));
    }

    .icon-path {
      fill: none;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 140;
      stroke-dashoffset: 140;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s;
    }

    .success-icon-path {
      stroke: var(--char-green);
      filter: drop-shadow(0 0 12px rgba(0, 255, 102, 0.8));
    }

    .error-icon-path {
      stroke: var(--char-pink);
      filter: drop-shadow(0 0 12px rgba(255, 51, 102, 0.8));
    }

    .status-stage.active .circle-path {
      stroke-dashoffset: 0;
    }

    .status-stage.active .icon-path {
      stroke-dashoffset: 0;
    }

    .status-text-box {
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease 0.4s, transform 0.5s ease 0.4s;
    }

    .status-stage.active .status-text-box {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body onclick="handleUserTouch()" ontouchstart="handleUserTouch()">

  <!-- Шапка -->

  <!-- 1. ГЛАВНЫЙ ЭКРАН ОЖИДАНИЯ -->
  <div class="view-layer active" id="viewIdle">
    <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="font-size: 58px; font-weight: 900; letter-spacing: -2px; color: #ffffff;">Платите</div>

          <svg style="width: 26px; height: 26px; stroke: #000; stroke-width: 3.5; fill: none;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>

  <!-- 3. ЭКРАН СЧЕТА (ОПЛАТА) -->
  <div class="view-layer" id="viewInvoice">
    <div class="invoice-card">
      <div style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px;">Сумма к оплате</div>
      <div style="font-size: 52px; font-weight: 900; color: #fff; margin: 12px 0 24px 0; letter-spacing: -1px;" id="invoiceAmount">0 ₽</div>
      <div style="background: #ffffff; padding: 18px; border-radius: 20px; display: inline-block; margin-bottom: 20px;">
        <div id="qrCodeContainer" style="width: 180px; height: 180px; background: #111; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 600;">
          QR-код
        </div>
      </div>
      <div style="font-size: 15px; color: rgba(255,255,255,0.7); font-weight: 500;">Наведите камеру телефона для оплаты</div>
    </div>
  </div>

  <!-- 4. ЭКРАН УСПЕШНОЙ ОПЛАТЫ -->
  <div class="view-layer" id="viewSuccess">
    <div class="status-stage" id="successStage">
      <div class="pay-anim-box">
        <svg class="anim-svg" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" class="circle-path success-circle-path" />
          <path d="M 36,62 L 52,78 L 84,44" class="icon-path success-icon-path" />
        </svg>
      </div>
      <div class="status-text-box">
        <div style="font-size: 46px; font-weight: 900; color: #fff; letter-spacing: -1px;" id="successAmountDisplay">0 ₽</div>
        <div style="font-size: 22px; font-weight: 800; color: var(--char-green); margin-top: 6px; letter-spacing: 0.5px;">Успешно оплачено</div>
      </div>
    </div>
  </div>

  <!-- 5. ЭКРАН ОШИБКИ / НЕХВАТКИ СРЕДСТВ -->
  <div class="view-layer" id="viewError">
    <div class="status-stage" id="errorStage">
      <div class="pay-anim-box">
        <svg class="anim-svg" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" class="circle-path error-circle-path" />
          <path d="M 42,42 L 78,78 M 78,42 L 42,78" class="icon-path error-icon-path" />
        </svg>
      </div>
      <div class="status-text-box">
        <div style="font-size: 32px; font-weight: 900; color: #fff; letter-spacing: -0.5px;" id="errorTitleDisplay">Ошибка оплаты</div>
        <div style="font-size: 19px; font-weight: 700; color: var(--char-pink); margin-top: 8px;" id="errorSubDisplay">Недостаточно средств на карте</div>
      </div>
    </div>
  </div>

  <!-- Подвал -->
  <div style="position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 13px; color: rgba(255,255,255,0.25); font-weight: 600; z-index: 5;">
    Терминал №3815
  </div>

  <script>
    // Безопасное подключение к Socket.io серверу POS-терминала
    let socket;
    try {
      socket = (typeof io !== 'undefined') ? io() : null;
    } catch (err) {
      console.warn('Socket.io client connect error:', err);
    }

    // База из 60 реплик
    const REPLICAS = [
      { text: "Добро пожаловать! Выбирайте любой удобный способ оплаты", emotion: "normal" },
      { text: "QR-код на экране — это быстро и безопасно!", emotion: "smile" },
      { text: "Приложите телефон или карту к терминалу", emotion: "normal" },
      { text: "Быстрая оплата за пару секунд без лишних ожиданий", emotion: "wink" },
      { text: "Мы принимаем любые бесконтактные карты", emotion: "smile" },
      { text: "Оплачивайте смартфоном через СберПэй или СБП", emotion: "normal" },
      { text: "Отличный выбор! Переходим к оплате заказа", emotion: "heart" },
      { text: "Спасибо, что вы с нами сегодня!", emotion: "smile" },
      { text: "Безопасность каждого платежа гарантирована банком", emotion: "normal" },
      { text: "Улыбнитесь! Ваш заказ уже почти готов", emotion: "wink" },
      { text: "Нужен чек? Его можно получить на телефон или в бумажном виде", emotion: "normal" },
      { text: "Быстро, удобно и прямо здесь", emotion: "smile" },
      { text: "Прикладывайте карту или сканируйте код выше", emotion: "normal" },
      { text: "Мы ценим ваше время и комфорт", emotion: "heart" },
      { text: "Секунда — и оплата прошла успешно!", emotion: "wink" },
      { text: "Пользуйтесь оплатой по QR-коду со скидками", emotion: "smile" },
      { text: "Если возникнут вопросы, наш кассир всегда поможет", emotion: "normal" },
      { text: "Желаем вам прекрасного и продуктивного дня!", emotion: "heart" },
      { text: "Все платежи защищены современными протоколами", emotion: "normal" },
      { text: "Готовы принять ваш платеж в любое время", emotion: "wink" },
      { text: "Просто наведите камеру вашего смартфона на экран", emotion: "smile" },
      { text: "Надежная и мгновенная кассовая система", emotion: "normal" },
      { text: "Рады обслуживать вас на высшем уровне", emotion: "heart" },
      { text: "Оплата прошла — можно забирать заказ!", emotion: "wink" },
      { text: "Электронные чеки экономят бумагу и заботятся о природе", emotion: "normal" },
      { text: "Комфортная покупка начинается здесь", emotion: "smile" },
      { text: "Быстрое сканирование и моментальное зачисление", emotion: "normal" },
      { text: "Спасибо за доверие к нашему сервису!", emotion: "heart" },
      { text: "Ваш любимый способ оплаты всегда под рукой", emotion: "wink" },
      { text: "Приятного аппетита и отличного настроения!", emotion: "smile" },
      { text: "Современные технологии для вашего удобства", emotion: "normal" },
      { text: "Бесконтактно, безопасно и очень быстро", emotion: "wink" },
      { text: "Каждый платеж обрабатывается за доли секунды", emotion: "normal" },
      { text: "Мы работаем для того, чтобы вам было удобно", emotion: "heart" },
      { text: "Выбирайте привычный банк для перевода", emotion: "smile" },
      { text: "Надежная защита ваших финансовых данных", emotion: "normal" },
      { text: "Мгновенное подтверждение от кассы", emotion: "wink" },
      { text: "Прекрасный выбор товаров сегодня!", emotion: "heart" },
      { text: "Всегда рады видеть вас снова", emotion: "smile" },
      { text: "Оплачивайте в одно касание", emotion: "normal" },
      { text: "Удобный расчет без очередей и задержек", emotion: "wink" },
      { text: "Простота и скорость в каждом заказе", emotion: "normal" },
      { text: "Благодарим за покупку!", emotion: "heart" },
      { text: "Технологии будущего на нашем терминале", emotion: "smile" },
      { text: "Быстрые переводы через систему быстрых платежей", emotion: "normal" },
      { text: "Комфорт превыше всего", emotion: "wink" },
      { text: "Ваш платеж в надежных руках", emotion: "normal" },
      { text: "Отличного дня и удачных покупок!", emotion: "heart" },
      { text: "Мы делаем сервис лучше для вас каждый день", emotion: "smile" },
      { text: "Простая оплата в один клик", emotion: "normal" },
      { text: "Безупречная скорость работы терминала", emotion: "wink" },
      { text: "Спасибо за отличное настроение", emotion: "heart" },
      { text: "Безопасный расчет за заказы", emotion: "normal" },
      { text: "Удобно и понятно с первого взгляда", emotion: "smile" },
      { text: "Молниеносный отклик кассы", emotion: "wink" },
      { text: "Рады стараться для каждого клиента", emotion: "heart" },
      { text: "Проведите оплату любым привычным способом", emotion: "normal" },
      { text: "Быстрый расчет без лишних хлопот", emotion: "smile" },
      { text: "Спасибо, что выбрали именно нас!", emotion: "heart" }
    ];

    let idleTimer = null;
    let replicaInterval = null;
    let hasActiveInvoice = false;
    let isCharacterActive = false;
    let lastReplicaIndex = -1;

    const IDLE_TIMEOUT = 15000; // 15 секунд

    function switchView(viewId) {
      document.querySelectorAll('.view-layer').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');

      const glow = document.getElementById('ambientGlow');
      if (viewId === 'viewError') {
        glow.classList.add('error-mode');
      } else {
        glow.classList.remove('error-mode');
      }
    }

    function resetIdleTimer() {
      if (hasActiveInvoice) return;

      clearTimeout(idleTimer);
      stopCharacterMode();

      idleTimer = setTimeout(() => {
        if (!hasActiveInvoice) {
          startCharacterMode();
        }
      }, IDLE_TIMEOUT);
    }

    function handleUserTouch() {
      if (hasActiveInvoice) return;

      if (isCharacterActive) {
        stopCharacterMode();
      }
      resetIdleTimer();
    }

    function triggerCharacterMode() {
      if (hasActiveInvoice) return;
      clearTimeout(idleTimer);
      startCharacterMode();
    }

    function startCharacterMode() {
      isCharacterActive = true;
      switchView('viewCharacter');
      showNextRandomReplica();

      clearInterval(replicaInterval);
      replicaInterval = setInterval(() => {
        if (isCharacterActive && !hasActiveInvoice) {
          showNextRandomReplica();
        }
      }, 6000);
    }

    function stopCharacterMode() {
      isCharacterActive = false;
      clearInterval(replicaInterval);
      document.getElementById('speechBox').classList.remove('show');
      if (!hasActiveInvoice) {
        switchView('viewIdle');
      }
    }

    function showNextRandomReplica() {
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * REPLICAS.length);
      } while (randomIndex === lastReplicaIndex && REPLICAS.length > 1);
      lastReplicaIndex = randomIndex;

      const item = REPLICAS[randomIndex];
      const speechBox = document.getElementById('speechBox');
      const speechText = document.getElementById('speechText');
      const leftEye = document.getElementById('leftEye');
      const rightEye = document.getElementById('rightEye');

      speechBox.classList.remove('show');

      setTimeout(() => {
        applyEmotion(item.emotion, leftEye, rightEye);

        setTimeout(() => {
          speechText.textContent = item.text;
          speechBox.classList.add('show');
        }, 400);
      }, 300);
    }

    function applyEmotion(emotion, leftEye, rightEye) {
      leftEye.className = 'neon-eye';
      rightEye.className = 'neon-eye';
      leftEye.innerHTML = '';
      rightEye.innerHTML = '';

      if (emotion === 'smile') {
        leftEye.classList.add('pink-glow');
        rightEye.classList.add('pink-glow');
      } else if (emotion === 'wink') {
        rightEye.classList.add('wink');
      } else if (emotion === 'heart') {
        leftEye.classList.add('heart');
        rightEye.classList.add('heart');
        const heartSvg = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
        leftEye.innerHTML = heartSvg;
        rightEye.innerHTML = heartSvg;
      }
    }

    // Обработка получения счетов от POS-терминала
    function handleNewInvoice(data) {
      hasActiveInvoice = true;
      isCharacterActive = false;
      clearTimeout(idleTimer);
      clearInterval(replicaInterval);

      const amount = data && data.amount ? data.amount : 0;
      document.getElementById('invoiceAmount').textContent = amount.toLocaleString('ru-RU') + ' ₽';
      
      switchView('viewInvoice');
    }

    function handlePaymentSuccess(data) {
      hasActiveInvoice = false;
      const amount = data && data.transaction && data.transaction.amount ? data.transaction.amount : (data && data.amount ? data.amount : 0);
      document.getElementById('successAmountDisplay').textContent = amount.toLocaleString('ru-RU') + ' ₽';

      const successStage = document.getElementById('successStage');
      successStage.classList.remove('active');
      switchView('viewSuccess');

      setTimeout(() => {
        successStage.classList.add('active');
      }, 60);

      setTimeout(() => {
        successStage.classList.remove('active');
        switchView('viewIdle');
        resetIdleTimer();
      }, 5500);
    }

    function handlePaymentError(data) {
      hasActiveInvoice = false;
      const errTitle = data && data.title ? data.title : 'Ошибка оплаты';
      const errSub = data && data.message ? data.message : 'Недостаточно средств на карте';

      document.getElementById('errorTitleDisplay').textContent = errTitle;
      document.getElementById('errorSubDisplay').textContent = errSub;

      const errorStage = document.getElementById('errorStage');
      errorStage.classList.remove('active');
      switchView('viewError');

      setTimeout(() => {
        errorStage.classList.add('active');
      }, 60);

      setTimeout(() => {
        errorStage.classList.remove('active');
        switchView('viewIdle');
        resetIdleTimer();
      }, 5000);
    }

    function handleTransactionCancelled() {
      hasActiveInvoice = false;
      switchView('viewIdle');
      resetIdleTimer();
    }

    // Подписка на сокет-события
    if (socket) {
      socket.on('new_invoice', handleNewInvoice);
      socket.on('payment_success', handlePaymentSuccess);
      socket.on('payment_error', handlePaymentError);
      socket.on('transaction_cancelled', handleTransactionCancelled);
    }

    window.onload = function() {
      resetIdleTimer();
    };
  </script>
</body>
</html>
