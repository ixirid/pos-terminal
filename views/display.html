<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Экран Клиента</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #10b981;
      --error: #ef4444;
      --bg: #090d16;
      --surface: #111827;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }

    .card { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); padding: 32px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; max-width: 400px; width: 90%; }
    .qr-box img { width: 220px; height: 220px; border-radius: 16px; margin: 20px 0; background: #fff; padding: 10px; }

    .lock-overlay { position: fixed; inset: 0; background: #1f2937; z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .lock-overlay.active { display: flex; }
  </style>
</head>
<body>

  <div class="card" id="idleState">
    <h2>Экран Кассы</h2>
    <p style="color: #9ca3af; margin-top: 8px;">Готов к работе</p>
  </div>

  <div class="card" id="qrState" style="display: none;">
    <h3>Сканируйте для оплаты</h3>
    <div class="qr-box"><img id="qrImg" src=""></div>
    <h2 style="color: var(--primary);" id="qrAmount">0 ₽</h2>
  </div>

  <div class="card" id="successState" style="display: none;">
    <div style="font-size: 60px; color: var(--primary);">✓</div>
    <h2>Оплата прошла!</h2>
    <p style="font-size: 24px; margin: 12px 0;" id="successAmount">0 ₽</p>
    <p style="color: #9ca3af;">Остаток на карте: <strong style="color: #fff;" id="remainingBalance">0 ₽</strong></p>
  </div>

  <div class="card" id="errorState" style="display: none;">
    <div style="font-size: 60px; color: var(--error);">✕</div>
    <h2>Ошибка оплаты</h2>
    <p style="color: #9ca3af; margin-top: 8px;">Недостаточно средств</p>
  </div>

  <!-- Экран Блокировки -->
  <div class="lock-overlay" id="lockOverlay">
    <div style="font-size: 80px;">🔒</div>
    <h2 style="margin-top: 16px;">Терминал заблокирован</h2>
  </div>

  <script>
    const socket = io();

    // Синтезатор звуков
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    socket.emit('register_display', { name: 'Главный экран' });

    function hideAll() {
      document.getElementById('idleState').style.display = 'none';
      document.getElementById('qrState').style.display = 'none';
      document.getElementById('successState').style.display = 'none';
      document.getElementById('errorState').style.display = 'none';
    }

    socket.on('new_transaction', (tx) => {
      hideAll();
      document.getElementById('qrImg').src = tx.qrCode;
      document.getElementById('qrAmount').textContent = tx.amount.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('qrState').style.display = 'flex';
    });

    socket.on('payment_success', (data) => {
      hideAll();
      playSound('success');
      document.getElementById('successAmount').textContent = data.transaction.amount.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('remainingBalance').textContent = data.cardRemaining.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('successState').style.display = 'flex';
      setTimeout(() => { hideAll(); document.getElementById('idleState').style.display = 'flex'; }, 5000);
    });

    socket.on('payment_failed', () => {
      hideAll();
      playSound('error');
      document.getElementById('errorState').style.display = 'flex';
      setTimeout(() => { hideAll(); document.getElementById('idleState').style.display = 'flex'; }, 4000);
    });

    socket.on('transaction_cancelled', () => {
      hideAll();
      document.getElementById('idleState').style.display = 'flex';
    });

    socket.on('terminal_locked', () => { document.getElementById('lockOverlay').classList.add('active'); });
    socket.on('terminal_unlocked', () => { document.getElementById('lockOverlay').classList.remove('active'); });
  </script>
</body>
</html>
