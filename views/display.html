<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SberPay POS Terminal Display</title>
  <script src="/socket.io/socket.io.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --sber-green: #22c55e;
      --sber-green-bright: #00e676;
      --sber-green-glow: rgba(0, 230, 118, 0.4);
      --bg-dark: #020c07;
      --bg-gradient: radial-gradient(circle at 50% 35%, #083b25 0%, #031c11 60%, #010805 100%);
      --text-main: #ffffff;
      --text-muted: #a3c4b5;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
    }

    .viewport {
      width: 100vw;
      height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Состояния экрана */
    .state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 20px 16px;
      opacity: 0;
      transform: scale(0.97);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      box-sizing: border-box;
    }

    .state.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* --- 1. ЭКРАН ОЖИДАНИЯ (IDLE) --- */
    .idle-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
    }

    .sber-pay-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 26px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.3px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .sber-pay-badge .check-circle {
      width: 30px;
      height: 30px;
      background: var(--sber-green-bright);
      border-radius: 50%;
      color: #010a06;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 0 12px var(--sber-green-bright);
    }

    .idle-main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-left: 8px;
      margin: auto 0;
    }

    .idle-title {
      font-size: clamp(54px, 13vw, 84px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -2px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .idle-title .row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .green-dot-icon {
      width: clamp(38px, 9vw, 56px);
      height: clamp(38px, 9vw, 56px);
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 230, 118, 0.8);
      display: inline-block;
      flex-shrink: 0;
    }

    .green-check-icon {
      width: clamp(44px, 10vw, 64px);
      height: clamp(44px, 10vw, 64px);
      background: #00e676;
      border-radius: 16px;
      color: #02120b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 900;
      box-shadow: 0 0 25px rgba(0, 230, 118, 0.7);
      flex-shrink: 0;
    }

    .idle-footer {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 700;
      padding-bottom: 8px;
      letter-spacing: 0.5px;
    }

    /* --- 2. ЭКРАН ОПЛАТЫ (PAYMENT) --- */
    .pay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 18px 22px;
      backdrop-filter: blur(14px);
      flex-shrink: 0;
    }

    .pay-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pay-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .pay-amount-display {
      font-size: clamp(38px, 9.5vw, 54px);
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1;
    }

    .cancel-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .cancel-btn:active {
      transform: scale(0.9);
      background: rgba(239, 68, 68, 0.5);
    }

    /* Основной контейнер оплаты - растягивается на весь остаток экрана без дыр */
    .pay-body-vertical {
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
      gap: 14px;
      min-height: 0;
    }

    /* Верхняя зона: Оплата картой / NFC (растянута на весь квадрат) */
    .card-nfc-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: rgba(0, 230, 118, 0.08);
      border: 2px solid rgba(0, 230, 118, 0.4);
      border-radius: 26px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 230, 118, 0.18);
    }

    /* Анимированная пластиковая карта + Волны NFC */
    .nfc-animation-box {
      position: relative;
      width: 130px;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .nfc-pulse-ring {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2.5px solid var(--sber-green-bright);
      opacity: 0;
      animation: nfc-pulse 2.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .nfc-pulse-ring:nth-child(2) {
      animation-delay: 0.7s;
    }

    .nfc-pulse-ring:nth-child(3) {
      animation-delay: 1.4s;
    }

    .animated-card-graphic {
      width: 100px;
      height: 62px;
      background: linear-gradient(135deg, #00e676 0%, #00897b 100%);
      border-radius: 12px;
      position: relative;
      box-shadow: 0 8px 25px rgba(0, 230, 118, 0.5);
      z-index: 2;
      animation: card-float 2.5s infinite ease-in-out;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      padding: 8px;
    }

    .card-chip {
      width: 18px;
      height: 13px;
      background: #ffd700;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    .card-waves-icon {
      position: absolute;
      right: 12px;
      top: 10px;
      font-size: 16px;
      color: #ffffff;
      font-weight: 900;
      opacity: 0.95;
    }

    .card-hint-text {
      font-size: clamp(26px, 6.8vw, 36px);
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      line-height: 1.15;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .card-subhint {
      font-size: clamp(14px, 3.8vw, 17px);
      color: var(--sber-green-bright);
      font-weight: 800;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Нижняя зона: Крупный QR-код (растянут на весь нижний квадрат) */
    .qr-section {
      flex: 1.35;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 26px;
      padding: 16px;
    }

    .qr-frame {
      position: relative;
      background: #ffffff;
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Огромный QR для сканирования */
    .qr-frame img {
      width: clamp(145px, 39vw, 220px);
      height: clamp(145px, 39vw, 220px);
      display: block;
      border-radius: 10px;
      object-fit: contain;
    }

    .qr-info-side {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    .qr-hint-text {
      font-size: clamp(22px, 5.8vw, 32px);
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -0.4px;
    }

    .qr-subtext {
      font-size: clamp(13px, 3.6vw, 16px);
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 600;
      line-height: 1.35;
    }

    /* --- 3. ЭКРАН УСПЕХА (SUCCESS) --- */
    .success-viewport {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 20px;
    }

    .success-icon-box {
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 75px;
      color: #02120b;
      margin-bottom: 24px;
      box-shadow: 0 0 50px rgba(0, 230, 118, 0.7);
      animation: pop-in 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-title {
      font-size: clamp(40px, 10vw, 54px);
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .success-subtitle {
      font-size: clamp(22px, 5.5vw, 28px);
      color: var(--sber-green-bright);
      font-weight: 800;
    }

    /* АНИМАЦИИ */
    @keyframes nfc-pulse {
      0% {
        transform: scale(0.6);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.65);
        opacity: 0;
      }
    }

    @keyframes card-float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(-3deg);
      }
    }

    @keyframes pop-in {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <main class="viewport">
    
    <!-- 1. ЭКРАН ОЖИДАНИЯ (IDLE) -->
    <section id="state-idle" class="state active">
      <header class="idle-header">
        <div class="sber-pay-badge">
          <span class="check-circle">✓</span>
          <span>Pay</span>
        </div>
      </header>

      <div class="idle-main-content">
        <div class="idle-title">
          <div>платите</div>
          <div class="row">
            <span class="green-dot-icon"></span>
            <span>как вам</span>
          </div>
          <div class="row">
            <span>удобно</span>
            <span class="green-check-icon">✓</span>
          </div>
        </div>
      </div>

      <footer class="idle-footer">
        <span>SberPay Terminal • Активен</span>
      </footer>
    </section>

    <!-- 2. ЭКРАН ОПЛАТЫ (PAYMENT) -->
    <section id="state-pay" class="state">
      <header class="pay-header">
        <div class="pay-title-group">
          <span class="pay-subtitle">К оплате</span>
          <div id="pay-amount" class="pay-amount-display">0,00 ₽</div>
        </div>
        <div class="cancel-btn" onclick="cancelPayment()" title="Отменить">✕</div>
      </header>

      <div class="pay-body-vertical">
        <!-- Квадрат 1: Приложите карту / NFC с анимацией (на весь верхний блок) -->
        <div class="card-nfc-section">
          <div class="nfc-animation-box">
            <div class="nfc-pulse-ring"></div>
            <div class="nfc-pulse-ring"></div>
            <div class="nfc-pulse-ring"></div>
            <div class="animated-card-graphic">
              <div class="card-chip"></div>
              <div class="card-waves-icon">))))</div>
            </div>
          </div>
          <div class="card-hint-text">Приложите карту<br>или телефон</div>
          <div class="card-subhint">Бесконтактная оплата NFC</div>
        </div>

        <!-- Квадрат 2: Крупный QR-код (на весь нижний блок) -->
        <div class="qr-section">
          <div class="qr-frame">
            <img id="qr-image" src="" alt="QR-код оплаты">
          </div>
          <div class="qr-info-side">
            <div class="qr-hint-text">Отсканируйте<br>QR-код</div>
            <div class="qr-subtext">Камерой смартфона<br>или через СберБанк Онлайн</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. ЭКРАН УСПЕХА (SUCCESS) -->
    <section id="state-success" class="state">
      <div class="success-viewport">
        <div class="success-icon-box">✓</div>
        <h2 class="success-title">Оплачено!</h2>
        <p class="success-subtitle" id="success-amount-text">Спасибо за покупку</p>
      </div>
    </section>

  </main>

  <script>
    const socket = io();

    const stateIdle = document.getElementById('state-idle');
    const statePay = document.getElementById('state-pay');
    const stateSuccess = document.getElementById('state-success');
    
    const payAmount = document.getElementById('pay-amount');
    const qrImage = document.getElementById('qr-image');
    const successAmountText = document.getElementById('success-amount-text');

    function switchState(targetState) {
      [stateIdle, statePay, stateSuccess].forEach(el => el.classList.remove('active'));
      targetState.classList.add('active');
    }

    // Форматирование суммы в стиле Сбербанка: 1 500,00 ₽
    function formatCurrency(num) {
      return num.toLocaleString('ru-RU', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' ₽';
    }

    // Инициализация при подключении
    socket.on('init_state', (data) => {
      if (data.activeTransaction && data.activeTransaction.status === 'pending') {
        renderPayState(data.activeTransaction);
      } else {
        switchState(stateIdle);
      }
    });

    // Создание транзакции с терминала
    socket.on('transaction_created', (tx) => {
      renderPayState(tx);
    });

    // Отображение данных оплаты
    function renderPayState(tx) {
      payAmount.textContent = formatCurrency(parseFloat(tx.amount));
      qrImage.src = tx.qrCode;
      switchState(statePay);
    }

    // Успешная оплата
    socket.on('payment_success', (data) => {
      if (data && data.transaction) {
        successAmountText.textContent = `${formatCurrency(data.transaction.amount)}`;
      }
      switchState(stateSuccess);
      setTimeout(() => {
        switchState(stateIdle);
      }, 3200);
    });

    // Отмена или сброс
    socket.on('transaction_cancelled', () => {
      switchState(stateIdle);
    });

    socket.on('payment_failed', () => {
      switchState(stateIdle);
    });

    // Ручная отмена нажатием на крестик
    function cancelPayment() {
      fetch('/api/cancel-transaction', { method: 'POST' })
        .catch(err => console.error(err));
    }
  </script>
</body>
</html>
