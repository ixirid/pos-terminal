<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Дисплей Клиента — Оплата</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
--primary: #10b981;
--primary-glow: rgba(16, 185, 129, 0.55);
--bg-base: #05080e;
--border-glass: rgba(255, 255, 255, 0.14);
--text-main: #ffffff;
--text-muted: #9ca3af;
/* Неоновые цвета персонажа */
--character-color: #38ef7d;
--character-glow: rgba(56, 239, 125, 0.95);
--character-heart-color: #ff2a85;
--character-heart-glow: rgba(255, 42, 133, 0.95);
--character-blue-color: #00d2ff;
--character-blue-glow: rgba(0, 210, 255, 0.95);
--character-purple-color: #b5179e;
--character-purple-glow: rgba(181, 23, 158, 0.95);
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
user-select: none;
-webkit-tap-highlight-color: transparent;
}
body {
background-color: var(--bg-base);
color: var(--text-main);
height: 100vh;
height: 100dvh;
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
padding: 24px 16px;
position: relative;
transition: background-color 0.8s ease;
}
/* ФОНОВЫЙ НЕОНОВЫЙ ГРАДИЕНТ */
.bg-glow {
position: absolute;
width: 600px;
height: 600px;
background: radial-gradient(circle, rgba(16, 185, 129, 0.45) 0%, rgba(56, 239, 125, 0.2) 45%, transparent 70%);
filter: blur(100px);
border-radius: 50%;
pointer-events: none;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
opacity: 0.85;
animation: ambientGlow 8s ease-in-out infinite alternate;
transition: all 0.8s ease;
}
@keyframes ambientGlow {
0% { transform: translate(-50%, -50%) scale(0.9); }
100% { transform: translate(-50%, -50%) scale(1.15); }
}
/* ШАПКА */
.header {
width: 100%;
max-width: 460px;
display: flex;
justify-content: space-between;
align-items: center;
z-index: 100;
}
.pay-badge {
display: inline-flex;
align-items: center;
gap: 10px;
background: rgba(255, 255, 255, 0.08);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
padding: 10px 22px;
border-radius: 30px;
border: 1px solid rgba(255, 255, 255, 0.2);
font-size: 16px;
font-weight: 800;
color: #ffffff;
cursor: pointer;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
transition: all 0.2s ease;
z-index: 200;
}
.pay-badge:active {
transform: scale(0.92);
background: rgba(56, 239, 125, 0.3);
border-color: rgba(56, 239, 125, 0.6);
}
.pulse-dot {
width: 10px;
height: 10px;
background: #38ef7d;
border-radius: 50%;
box-shadow: 0 0 12px #38ef7d;
animation: pulse 1.8s infinite ease-in-out;
}
@keyframes pulse {
0% { transform: scale(0.9); opacity: 0.7; }
50% { transform: scale(1.4); opacity: 1; }
100% { transform: scale(0.9); opacity: 0.7; }
}
/* КОНТЕЙНЕР ДЛЯ ЭКРАНОВ */
.display-screen {
width: 100%;
max-width: 460px;
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 10;
position: relative;
}
/* ПЕРЕКЛЮЧЕНИЕ СЛОЕВ (ПОЛНОСТЬЮ НАДЕЖНОЕ) */
.view-layer {
position: absolute;
inset: 0;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
opacity: 0;
transform: scale(0.95);
transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.view-layer.active {
display: flex !important;
opacity: 1;
transform: scale(1);
}
/* 1. ЭКРАН ОЖИДАНИЯ (ТОЧНО ПО СКРИНШОТУ) */
.view-idle {
text-align: center;
width: 100%;
}
.idle-title {
font-size: 52px;
font-weight: 900;
line-height: 1.2;
letter-spacing: -1px;
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}
.idle-title .white-line {
color: #ffffff;
}
.idle-title .green-line {
color: #38ef7d;
display: inline-flex;
align-items: center;
gap: 12px;
text-shadow: 0 0 25px rgba(56, 239, 125, 0.6);
margin: 4px 0;
}
.idle-icon-check {
width: 44px;
height: 44px;
background: #38ef7d;
border-radius: 50%;
display: inline-flex;
align-items: center;
justify-content: center;
box-shadow: 0 0 20px rgba(56, 239, 125, 0.8);
color: #000000;
font-weight: 900;
font-size: 26px;
flex-shrink: 0;
}
/* 2. ПЕРСОНАЖ */
.view-character {
gap: 36px;
width: 100%;
cursor: pointer;
}
.eyes-container {
display: flex;
align-items: center;
justify-content: center;
gap: 24px;
height: 130px;
position: relative;
}
.eye-pill {
width: 125px;
height: 96px;
background: var(--character-color);
border-radius: 42px;
box-shadow: 0 0 50px var(--character-glow), inset 0 -6px 12px rgba(0,0,0,0.2);
transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
position: relative;
}
.eye-pill::after {
content: '';
position: absolute;
top: 14%;
left: 18%;
width: 28%;
height: 28%;
background: rgba(255, 255, 255, 0.85);
border-radius: 50%;
}
/* ЭМОЦИИ */
.eyes-container.blinking .eye-pill {
transform: scaleY(0.05);
}
.eyes-container.happy .eye-pill {
height: 68px;
border-radius: 70px 70px 20px 20px;
transform: translateY(-8px) scaleY(0.88);
clip-path: ellipse(100% 75% at 50% 0%);
}
.eyes-container.heart .eye-pill {
background: var(--character-heart-color);
box-shadow: 0 0 65px var(--character-heart-glow);
clip-path: path("M 12,35 C 12,17 28,5 45,5 C 60,5 70,16 75,25 C 80,16 90,5 105,5 C 122,5 138,17 138,35 C 138,62 90,92 75,108 C 60,92 12,62 12,35 Z");
width: 125px;
height: 115px;
border-radius: 0;
}
.eyes-container.wink .eye-pill:last-child {
transform: scaleY(0.06);
}
.eyes-container.blue .eye-pill {
background: var(--character-blue-color);
box-shadow: 0 0 55px var(--character-blue-glow);
}
.eyes-container.purple .eye-pill {
background: var(--character-purple-color);
box-shadow: 0 0 55px var(--character-purple-glow);
}
.speech-bubble {
font-size: 24px;
font-weight: 800;
text-align: center;
color: #ffffff;
line-height: 1.4;
padding: 0 16px;
max-width: 420px;
min-height: 80px;
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
transform: translateY(10px);
transition: all 0.5s ease;
text-shadow: 0 4px 15px rgba(0,0,0,0.9);
}
.speech-bubble.text-visible {
opacity: 1;
transform: translateY(0);
}
/* 3. ОПЛАТА ПО QR */
.view-pay {
width: 100%;
flex-direction: column;
gap: 20px;
}
.amount-header {
text-align: center;
}
.amount-label {
font-size: 15px;
color: var(--text-muted);
font-weight: 700;
}
.amount-value {
font-size: 48px;
font-weight: 900;
color: #fff;
text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
}
.qr-card {
background: rgba(15, 23, 42, 0.85);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border: 1px solid var(--border-glass);
border-radius: 32px;
padding: 28px 24px;
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
width: 100%;
}
.qr-frame {
background: #ffffff;
padding: 18px;
border-radius: 24px;
display: flex;
align-items: center;
justify-content: center;
}
.qr-frame img {
width: 200px;
height: 200px;
display: block;
}
.qr-footer-hint {
font-size: 13px;
color: #38ef7d;
font-weight: 700;
display: flex;
align-items: center;
gap: 8px;
}
/* 4. СВЯЗЬ С СЕРВЕРОМ */
.view-processing {
gap: 20px;
}
.spinner-ring {
width: 70px;
height: 70px;
border: 5px solid rgba(255, 255, 255, 0.1);
border-top-color: #38ef7d;
border-radius: 50%;
animation: spin 0.9s linear infinite;
}
@keyframes spin {
to { transform: rotate(360deg); }
}
/* 5. УСПЕХ */
.view-success {
text-align: center;
width: 100%;
}
.success-anim-container {
width: 140px;
height: 140px;
margin: 0 auto 24px;
display: flex;
align-items: center;
justify-content: center;
position: relative;
}
.success-svg-ring {
position: absolute;
width: 100%;
height: 100%;
transform: rotate(-90deg);
}
.success-svg-ring circle {
fill: none;
stroke-width: 7;
stroke-linecap: round;
}
.success-svg-ring .bg-circle {
stroke: rgba(56, 239, 125, 0.15);
}
.success-svg-ring .animated-circle {
stroke: #38ef7d;
stroke-dasharray: 440;
stroke-dashoffset: 440;
filter: drop-shadow(0 0 12px #38ef7d);
}
.success-check-mark {
width: 52px;
height: 52px;
stroke: #ffffff;
stroke-width: 5;
stroke-linecap: round;
stroke-linejoin: round;
fill: none;
stroke-dasharray: 100;
stroke-dashoffset: 100;
z-index: 2;
}
.run-circle-anim {
animation: drawCircle 0.8s forwards;
}
.run-check-anim {
animation: drawCheck 0.5s 0.5s forwards;
}
@keyframes drawCircle { to { stroke-dashoffset: 0; } }
@keyframes drawCheck { to { stroke-dashoffset: 0; } }
.success-amount {
font-size: 46px;
font-weight: 900;
color: #fff;
margin-bottom: 6px;
}
.success-status-text {
font-size: 22px;
font-weight: 800;
color: #38ef7d;
}
/* ПОДВАЛ */
.footer {
width: 100%;
text-align: center;
z-index: 10;
}
.terminal-label {
font-size: 13px;
font-weight: 700;
color: var(--text-muted);
}
.blocked-overlay {
position: fixed;
inset: 0;
background: rgba(5, 8, 14, 0.96);
backdrop-filter: blur(24px);
z-index: 999;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 14px;
}
.blocked-overlay.active {
display: flex !important;
}
</style>
</head>
<body>
<div class="bg-glow" id="bgGlow"></div>
<!-- ШАПКА -->
<header class="header">
<div class="pay-badge" id="payBtn" onclick="triggerSecretCharacter(event)">
<span class="pulse-dot"></span>
<span>Pay</span>
</div>
<div style="font-size: 12px; font-weight: 700; color: var(--text-muted);">POS System</div>
</header>
<!-- ДИСПЛЕЙ -->
<main class="display-screen">
<!-- 1. ЭКРАН ОЖИДАНИЯ -->
<div class="view-layer view-idle active" id="viewIdle">
<h1 class="idle-title">
<span class="white-line">Платите</span>
<span class="green-line">как вам <span class="idle-icon-check">✓</span></span>
<span class="white-line">удобно</span>
</h1>
</div>
<!-- 2. ПЕРСОНАЖ -->
<div class="view-layer view-character" id="viewCharacter" onclick="exitCharacterMode()">
<div class="eyes-container" id="eyesContainer">
<div class="eye-pill"></div>
<div class="eye-pill"></div>
</div>
<div class="speech-bubble" id="speechBubble">
— Привет! Я очень рад вас видеть!
</div>
</div>
<!-- 3. ОПЛАТА ПО QR -->
<div class="view-layer view-pay" id="viewPay">
<div class="amount-header">
<div class="amount-label">Сумма к оплате</div>
<div class="amount-value" id="payAmountDisplay">0 ₽</div>
</div>
<div class="qr-card">
<div style="font-size: 17px; font-weight: 800; color: #fff;">Оплатить по QR-коду</div>
<div class="qr-frame">
<img id="qrImage" src="" alt="QR-код оплаты">
</div>
<div class="qr-footer-hint">
<span class="pulse-dot"></span> Отсканируйте приложением банка
</div>
</div>
</div>
<!-- 4. СВЯЗЬ С СЕРВЕРОМ -->
<div class="view-layer view-processing" id="viewProcessing">
<div class="spinner-ring"></div>
<div style="font-size: 20px; font-weight: 800; color: #fff;">Связь с сервером...</div>
</div>
<!-- 5. ОПЛАЧЕНО -->
<div class="view-layer view-success" id="viewSuccess">
<div class="success-anim-container">
<svg class="success-svg-ring" viewBox="0 0 150 150">
<circle class="bg-circle" cx="75" cy="75" r="66"></circle>
<circle class="animated-circle" id="successCircle" cx="75" cy="75" r="66"></circle>
</svg>
<svg class="success-check-mark" id="successCheck" viewBox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
<div class="success-amount" id="successAmountDisplay">0 ₽</div>
<div class="success-status-text">Оплачено</div>
</div>
</main>
<!-- ПОДВАЛ -->
<footer class="footer">
<div class="terminal-label" id="terminalNumberLabel">Терминал №3815</div>
</footer>
<!-- БЛОКИРОВКА -->
<div class="blocked-overlay" id="blockedOverlay">
<div style="font-size: 44px;">🔒</div>
<h2 style="font-size: 22px; font-weight: 800; color: #fff;">Дисплей заблокирован</h2>
</div>
<script>
const socket = io();
let displayId = localStorage.getItem('pos_display_id');
if (!displayId) {
displayId = 'disp_' + Math.random().toString(36).substring(2, 7);
localStorage.setItem('pos_display_id', displayId);
}
const terminalNum = displayId.replace(/\D/g, '').substring(0, 4) || '3815';
document.getElementById('terminalNumberLabel').textContent = ⁠Терминал №${terminalNum}⁠;
const REPLICAS = [
{ text: "— Привет! Я очень рад вас видеть!", emotion: "happy" },
{ text: "— Оплату по QR-коду можно провести с мобильного приложения!", emotion: "wink" },
{ text: "— Вы можете оплатить любую покупку картой Сбербанка!", emotion: "happy" },
{ text: "— Скидки, кешбэк и бонусы ждут вас с подпиской СберПрайм!", emotion: "heart" },
{ text: "— Наведите камеру телефона на QR-код для оплаты!", emotion: "blue" },
{ text: "— Хорошего дня и замечательного настроения!", emotion: "happy" },
{ text: "— Платить смартфоном — это быстро и безопасно!", emotion: "purple" },
{ text: "— Спасибо, что выбираете нас!", emotion: "heart" }
];
let characterLoopTimeout = null;
let idleTimer = null;
let currentView = 'viewIdle';
let hasActiveInvoice = false;
let replicaIndex = 0;
function showLayer(layerId) {
currentView = layerId;
document.querySelectorAll('.view-layer').forEach(layer => {
layer.classList.remove('active');
});
const target = document.getElementById(layerId);
if (target) {
target.classList.add('active');
}
const bgGlow = document.getElementById('bgGlow');
if (layerId === 'viewCharacter') {
document.body.style.backgroundColor = '#000000';
bgGlow.style.opacity = '0.9';
bgGlow.style.background = 'radial-gradient(circle, rgba(56, 239, 125, 0.6) 0%, rgba(181, 23, 158, 0.4) 60%, transparent 100%)';
} else {
document.body.style.backgroundColor = '#05080e';
bgGlow.style.opacity = '0.85';
bgGlow.style.background = 'radial-gradient(circle, rgba(16, 185, 129, 0.45) 0%, rgba(56, 239, 125, 0.2) 45%, transparent 70%)';
}
}
function resetIdleTimer() {
clearTimeout(idleTimer);
if (hasActiveInvoice) return;
idleTimer = setTimeout(() => {
startCharacterMode();
}, 15000);
}
function triggerSecretCharacter(event) {
if (event) event.stopPropagation();
if (hasActiveInvoice) return;
startCharacterMode();
}
function startCharacterMode() {
clearTimeout(idleTimer);
showLayer('viewCharacter');
cycleCharacterState();
}
function exitCharacterMode() {
if (currentView === 'viewCharacter') {
stopCharacterMode();
showLayer('viewIdle');
resetIdleTimer();
}
}
function stopCharacterMode() {
clearTimeout(characterLoopTimeout);
const bubble = document.getElementById('speechBubble');
if (bubble) bubble.classList.remove('text-visible');
}
function cycleCharacterState() {
if (currentView !== 'viewCharacter') return;
const replica = REPLICAS[replicaIndex];
replicaIndex = (replicaIndex + 1) % REPLICAS.length;
const bubble = document.getElementById('speechBubble');
const eyes = document.getElementById('eyesContainer');
bubble.classList.remove('text-visible');
setTimeout(() => {
eyes.className = 'eyes-container ' + replica.emotion;
setTimeout(() => {
eyes.classList.add('blinking');
setTimeout(() => eyes.classList.remove('blinking'), 180);
}, 200);
setTimeout(() => {
bubble.textContent = replica.text;
bubble.classList.add('text-visible');
}, 400);
}, 300);
characterLoopTimeout = setTimeout(() => {
cycleCharacterState();
}, 5000);
}
// SOCKET.IO
socket.on('connect', () => {
socket.emit('register_display', { id: displayId, name: ⁠Дисплей №${terminalNum}⁠ });
});
socket.on('show_qr', (data) => {
hasActiveInvoice = true;
stopCharacterMode();
clearTimeout(idleTimer);
document.getElementById('payAmountDisplay').textContent = data.amount.toLocaleString('ru-RU') + ' ₽';
document.getElementById('qrImage').src = data.qrCode;
showLayer('viewPay');
});
socket.on('processing_payment', () => {
showLayer('viewProcessing');
});
socket.on('payment_success', (data) => {
hasActiveInvoice = false;
const amount = data.transaction ? data.transaction.amount : 0;
document.getElementById('successAmountDisplay').textContent = amount.toLocaleString('ru-RU') + ' ₽';
showLayer('viewSuccess');
const circle = document.getElementById('successCircle');
const check = document.getElementById('successCheck');
circle.classList.remove('run-circle-anim');
check.classList.remove('run-check-anim');
void circle.offsetWidth;
circle.classList.add('run-circle-anim');
check.classList.add('run-check-anim');
setTimeout(() => {
showLayer('viewIdle');
resetIdleTimer();
}, 4800);
});
socket.on('transaction_cancelled', () => {
hasActiveInvoice = false;
showLayer('viewIdle');
resetIdleTimer();
});
socket.on('display_block_status', (data) => {
const overlay = document.getElementById('blockedOverlay');
if (data.isBlocked) {
overlay.classList.add('active');
} else {
overlay.classList.remove('active');
}
});
resetIdleTimer();
</script>
</body>
</html>
