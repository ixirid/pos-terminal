<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Дисплей Клиента — Оплата</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
--primary: #10b981;
--primary-glow: rgba(16, 185, 129, 0.55);
--bg-base: #05080e;
--surface-glass: rgba(255, 255, 255, 0.05);
--surface-card: rgba(15, 23, 42, 0.78);
--border-glass: rgba(255, 255, 255, 0.14);
--text-main: #ffffff;
--text-muted: #9ca3af;
/* Сочные, яркие неновые цвета глазок */
--character-color: #38ef7d;
--character-glow: rgba(56, 239, 125, 0.95);
--character-heart-color: #ff2a85;
--character-heart-glow: rgba(255, 42, 133, 0.95);
--character-blue-color: #00d2ff;
--character-blue-glow: rgba(0, 210, 255, 0.95);
--character-purple-color: #b5179e;
--character-purple-glow: rgba(181, 23, 158, 0.95);
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
user-select: none;
-webkit-tap-highlight-color: transparent;
}
body {
background-color: var(--bg-base);
background-image:
radial-gradient(circle at 50% 15%, rgba(16, 185, 129, 0.22) 0%, transparent 65%),
radial-gradient(circle at 50% 85%, rgba(15, 23, 42, 0.8) 0%, var(--bg-base) 80%);
color: var(--text-main);
height: 100vh;
height: 100dvh;
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
padding: 24px 16px;
position: relative;
cursor: pointer;
transition: background-color 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
/* Фоновый динамический неоновый блеск */
.bg-glow {
position: absolute;
width: 550px;
height: 550px;
background: var(--primary-glow);
filter: blur(140px);
border-radius: 50%;
pointer-events: none;
top: 45%;
left: 50%;
transform: translate(-50%, -50%);
opacity: 0.35;
transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
/* Шапка с интерактивным Pay значком */
.header {
width: 100%;
max-width: 460px;
display: flex;
justify-content: space-between;
align-items: center;
z-index: 50;
}
.pay-badge {
display: inline-flex;
align-items: center;
gap: 8px;
background: rgba(255, 255, 255, 0.08);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
padding: 8px 18px;
border-radius: 24px;
border: 1px solid var(--border-glass);
font-size: 14px;
font-weight: 800;
letter-spacing: -0.2px;
cursor: pointer;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.pay-badge:active {
transform: scale(0.92);
background: rgba(16, 185, 129, 0.25);
border-color: rgba(16, 185, 129, 0.5);
}
.pulse-dot {
width: 9px;
height: 9px;
background: var(--primary);
border-radius: 50%;
box-shadow: 0 0 12px var(--primary);
animation: pulse 1.8s infinite ease-in-out;
}
@keyframes pulse {
0% { transform: scale(0.9); opacity: 0.7; }
50% { transform: scale(1.45); opacity: 1; filter: drop-shadow(0 0 8px var(--primary)); }
100% { transform: scale(0.9); opacity: 0.7; }
}
/* ОСНОВНОЙ КОНТЕЙНЕР СОСТОЯНИЙ */
.display-screen {
width: 100%;
max-width: 460px;
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 10;
position: relative;
}
/* ПЛАВНЫЕ ПЕРЕХОДЫ МЕЖДУ ЭКРАНАМИ (1.2s cubic-bezier) */
.view-layer {
position: absolute;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
opacity: 0;
pointer-events: none;
transform: scale(0.92) translateY(12px);
transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.view-layer.active {
opacity: 1;
pointer-events: auto;
transform: scale(1) translateY(0);
}
/* 1. ОБНОВЛЕННЫЙ ЭКРАН ОЖИДАНИЯ (ИЗЫСКАННЫЙ ДИЗАЙН) */
.view-idle {
text-align: center;
gap: 28px;
width: 100%;
}
.idle-hero-card {
background: linear-gradient(145deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
border: 1px solid var(--border-glass);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border-radius: 36px;
padding: 40px 24px;
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
width: 100%;
position: relative;
overflow: hidden;
}
.idle-hero-card::before {
content: '';
position: absolute;
top: -50%;
left: -50%;
width: 200%;
height: 200%;
background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 60%);
animation: rotateBg 15s linear infinite;
}
@keyframes rotateBg {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
.idle-title {
font-size: 42px;
font-weight: 900;
line-height: 1.12;
letter-spacing: -1.2px;
color: #ffffff;
z-index: 2;
}
.idle-title .highlight-green {
color: #38ef7d;
text-shadow: 0 0 20px rgba(56, 239, 125, 0.6);
display: inline-flex;
align-items: center;
gap: 8px;
}
.idle-icon-check {
width: 38px;
height: 38px;
background: linear-gradient(135deg, #38ef7d 0%, #10b981 100%);
border-radius: 50%;
display: inline-flex;
align-items: center;
justify-content: center;
box-shadow: 0 0 18px rgba(56, 239, 125, 0.8);
color: #000;
font-weight: 900;
font-size: 22px;
}
.idle-features {
display: flex;
gap: 10px;
z-index: 2;
flex-wrap: wrap;
justify-content: center;
}
.idle-chip {
background: rgba(255, 255, 255, 0.08);
border: 1px solid rgba(255, 255, 255, 0.15);
padding: 8px 14px;
border-radius: 20px;
font-size: 13px;
font-weight: 700;
color: var(--text-muted);
display: flex;
align-items: center;
gap: 6px;
}
/* 2. СОСТОЯНИЕ: ПЕРСОНАЖ */
.view-character {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 44px;
width: 100%;
}
/* УВЕЛИЧЕННЫЕ И ЯРКИЕ ГЛАЗА ПЕРСОНАЖА */
.eyes-container {
display: flex;
align-items: center;
justify-content: center;
gap: 24px;
height: 140px;
position: relative;
}
.eye-pill {
width: 125px;
height: 96px;
background: var(--character-color);
border-radius: 42px;
box-shadow: 0 0 50px var(--character-glow), inset 0 -6px 12px rgba(0,0,0,0.2);
transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
position: relative;
}
.eye-pill::after {
content: '';
position: absolute;
top: 14%;
left: 18%;
width: 28%;
height: 28%;
background: rgba(255, 255, 255, 0.85);
border-radius: 50%;
filter: blur(0.5px);
}
/* Анимационные мимики (Крупные сердечки, ушки, улыбочки) */
.eyes-container.blinking .eye-pill {
transform: scaleY(0.05);
}
.eyes-container.happy .eye-pill {
height: 68px;
border-radius: 70px 70px 20px 20px;
transform: translateY(-8px) scaleY(0.88);
clip-path: ellipse(100% 75% at 50% 0%);
}
/* БОЛЬШИЕ СЕРДЕЧКИ */
.eyes-container.heart .eye-pill {
background: var(--character-heart-color);
box-shadow: 0 0 65px var(--character-heart-glow);
clip-path: path("M 12,35 C 12,17 28,5 45,5 C 60,5 70,16 75,25 C 80,16 90,5 105,5 C 122,5 138,17 138,35 C 138,62 90,92 75,108 C 60,92 12,62 12,35 Z");
width: 125px;
height: 115px;
border-radius: 0;
}
.eyes-container.wink .eye-pill:last-child {
transform: scaleY(0.06);
}
.eyes-container.blue .eye-pill {
background: var(--character-blue-color);
box-shadow: 0 0 55px var(--character-blue-glow);
}
.eyes-container.purple .eye-pill {
background: var(--character-purple-color);
box-shadow: 0 0 55px var(--character-purple-glow);
}
.eyes-container.surprised .eye-pill {
width: 100px;
height: 120px;
border-radius: 50px;
}
/* ПОБЛЕСКИВАЮЩИЕ ЗВЕЗДОЧКИ (КАК НА ВИДЕО) */
.sparkles-layer {
position: absolute;
inset: -40px;
pointer-events: none;
opacity: 0;
transition: opacity 0.8s ease;
}
.eyes-container.happy .sparkles-layer,
.eyes-container.heart .sparkles-layer {
opacity: 1;
}
.sparkle {
position: absolute;
background: #fff;
clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
animation: floatSparkle 2s ease-in-out infinite alternate;
}
.sparkle-1 { width: 20px; height: 20px; top: -10px; left: 10px; animation-delay: 0s; }
.sparkle-2 { width: 16px; height: 16px; top: 10px; right: 10px; animation-delay: 0.5s; }
.sparkle-3 { width: 18px; height: 18px; bottom: -15px; left: 30px; animation-delay: 1s; }
@keyframes floatSparkle {
0% { transform: scale(0.6) rotate(0deg); opacity: 0.4; }
100% { transform: scale(1.2) rotate(45deg); opacity: 1; }
}
/* ТЕКСТОВАЯ РЕПЛИКА (СНАЧАЛА ЭМОЦИЯ, ПОТОМ МЯГКО ТЕКСТ) */
.speech-bubble {
font-size: 23px;
font-weight: 800;
text-align: center;
color: #ffffff;
line-height: 1.4;
padding: 0 20px;
max-width: 420px;
min-height: 85px;
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
transform: translateY(14px);
transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
filter: drop-shadow(0 6px 20px rgba(0,0,0,0.9));
}
.speech-bubble.text-visible {
opacity: 1;
transform: translateY(0);
}
/* 3. СОСТОЯНИЕ: ОПЛАТА ПО QR */
.view-pay {
width: 100%;
flex-direction: column;
gap: 20px;
}
.amount-header {
text-align: center;
margin-bottom: 4px;
}
.amount-label {
font-size: 15px;
color: var(--text-muted);
font-weight: 700;
}
.amount-value {
font-size: 48px;
font-weight: 900;
letter-spacing: -1.5px;
color: #fff;
text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
}
.qr-card {
background: var(--surface-card);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border: 1px solid var(--border-glass);
border-radius: 32px;
padding: 28px 24px;
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
width: 100%;
}
.qr-card-title {
font-size: 17px;
font-weight: 800;
color: #fff;
display: flex;
align-items: center;
gap: 8px;
width: 100%;
justify-content: center;
}
.qr-frame {
background: #ffffff;
padding: 18px;
border-radius: 24px;
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
display: flex;
align-items: center;
justify-content: center;
}
.qr-frame img {
width: 200px;
height: 200px;
display: block;
border-radius: 6px;
}
.qr-footer-hint {
font-size: 13px;
color: #38ef7d;
font-weight: 700;
display: flex;
align-items: center;
gap: 8px;
}
/* 4. СОСТОЯНИЕ: СВЯЗЬ С СЕРВЕРОМ */
.view-processing {
gap: 24px;
}
.spinner-ring {
width: 76px;
height: 76px;
border: 5px solid rgba(255, 255, 255, 0.1);
border-top-color: #38ef7d;
border-radius: 50%;
animation: spin 0.9s linear infinite;
box-shadow: 0 0 20px rgba(56, 239, 125, 0.3);
}
@keyframes spin {
to { transform: rotate(360deg); }
}
.processing-text {
font-size: 20px;
font-weight: 800;
color: #fff;
}
/* 5. СОСТОЯНИЕ: УСПЕХ */
.view-success {
text-align: center;
width: 100%;
}
.success-anim-container {
position: relative;
width: 150px;
height: 150px;
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 28px;
}
.success-svg-ring {
position: absolute;
width: 100%;
height: 100%;
transform: rotate(-90deg);
}
.success-svg-ring circle {
fill: none;
stroke-width: 7;
stroke-linecap: round;
}
.success-svg-ring .bg-circle {
stroke: rgba(56, 239, 125, 0.15);
}
.success-svg-ring .animated-circle {
stroke: #38ef7d;
stroke-dasharray: 440;
stroke-dashoffset: 440;
filter: drop-shadow(0 0 12px #38ef7d);
}
.success-check-mark {
width: 56px;
height: 56px;
stroke: #ffffff;
stroke-width: 5;
stroke-linecap: round;
stroke-linejoin: round;
fill: none;
stroke-dasharray: 100;
stroke-dashoffset: 100;
z-index: 2;
}
.run-circle-anim {
animation: drawCircle 0.9s cubic-bezier(0.65, 0, 0.45, 1) forwards;
}
.run-check-anim {
animation: drawCheck 0.5s 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
}
@keyframes drawCircle {
to { stroke-dashoffset: 0; }
}
@keyframes drawCheck {
to { stroke-dashoffset: 0; }
}
.success-amount {
font-size: 46px;
font-weight: 900;
color: #fff;
margin-bottom: 6px;
}
.success-status-text {
font-size: 22px;
font-weight: 800;
color: #38ef7d;
letter-spacing: -0.3px;
text-shadow: 0 0 15px rgba(56, 239, 125, 0.5);
}
/* ПОДВАЛ */
.footer {
width: 100%;
text-align: center;
z-index: 10;
}
.terminal-label {
font-size: 13px;
font-weight: 700;
color: var(--text-muted);
letter-spacing: 0.4px;
}
.blocked-overlay {
position: fixed;
inset: 0;
background: rgba(5, 8, 14, 0.96);
backdrop-filter: blur(24px);
z-index: 999;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 14px;
}
.blocked-overlay.active {
display: flex !important;
}
</style>
</head>

let characterLoopTimeout = null;
let idleTimer = null;
let currentView = 'viewIdle';
let hasActiveInvoice = false;
let usedIndices = [];
// Функция рандомайзера без повторов
function getRandomReplica() {
if (usedIndices.length >= REPLICAS_DATABASE.length) {
usedIndices = [];
}
let randIndex;
do {
randIndex = Math.floor(Math.random() * REPLICAS_DATABASE.length);
} while (usedIndices.includes(randIndex));
usedIndices.push(randIndex);
return REPLICAS_DATABASE[randIndex];
}
// Переключение слоев с МАКСИМАЛЬНО МЯГКИМ ПЕРЕХОДОМ
function showLayer(layerId) {
currentView = layerId;
document.querySelectorAll('.view-layer').forEach(layer => {
layer.classList.remove('active');
});
const target = document.getElementById(layerId);
if (target) {
target.classList.add('active');
}
const bgGlow = document.getElementById('bgGlow');
if (layerId === 'viewSuccess') {
document.body.style.backgroundColor = '#05080e';
bgGlow.style.opacity = '0.85';
bgGlow.style.background = 'rgba(56, 239, 125, 0.65)';
} else if (layerId === 'viewPay') {
document.body.style.backgroundColor = '#05080e';
bgGlow.style.opacity = '0.5';
bgGlow.style.background = 'var(--primary-glow)';
} else if (layerId === 'viewCharacter') {
document.body.style.backgroundColor = '#000000';
bgGlow.style.opacity = '0.75';
bgGlow.style.background = 'radial-gradient(circle, rgba(56, 239, 125, 0.5) 0%, rgba(181, 23, 158, 0.3) 60%, transparent 100%)';
} else {
document.body.style.backgroundColor = '#05080e';
bgGlow.style.opacity = '0.35';
bgGlow.style.background = 'var(--primary-glow)';
}
}
// Таймер ожидания (15 секунд)
function resetIdleTimer() {
clearTimeout(idleTimer);
if (hasActiveInvoice) return;
idleTimer = setTimeout(() => {
startCharacterMode();
}, 15000);
}
function handleUserInteraction() {
if (hasActiveInvoice) return;
if (currentView === 'viewCharacter') {
stopCharacterMode();
showLayer('viewIdle');
}
resetIdleTimer();
}
// СЕКРЕТНАЯ КНОПКА НА PAY ЗНАЧОК
function triggerSecretCharacter(event) {
event.stopPropagation();
if (hasActiveInvoice) return;
startCharacterMode();
}
// ЗАПУСК И УПРАВЛЕНИЕ ПЕРСОНАЖЕМ
function startCharacterMode() {
showLayer('viewCharacter');
cycleCharacterState();
}
function stopCharacterMode() {
clearTimeout(characterLoopTimeout);
const bubble = document.getElementById('speechBubble');
bubble.classList.remove('text-visible');
}
// МЯГКАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ: СНАЧАЛА ЭМОЦИЯ ГЛАЗ -> ЗАТЕМ МЯГКО ТЕКСТ
function cycleCharacterState() {
if (currentView !== 'viewCharacter') return;
const replica = getRandomReplica();
const bubble = document.getElementById('speechBubble');
const eyes = document.getElementById('eyesContainer');
// 1. Скрываем прошлый текст
bubble.classList.remove('text-visible');
setTimeout(() => {
// 2. Сначала плавно включаем эмоцию на глазках
eyes.className = 'eyes-container ' + replica.emotion;
// Моргание глаз для живости
setTimeout(() => {
eyes.classList.add('blinking');
setTimeout(() => eyes.classList.remove('blinking'), 180);
}, 300);
// 3. Спустя 700ms плавно проявляем текст
setTimeout(() => {
bubble.textContent = replica.text;
bubble.classList.add('text-visible');
}, 700);
}, 500);
// Задержка между репликами (5.5 секунд для комфортного чтения)
characterLoopTimeout = setTimeout(() => {
cycleCharacterState();
}, 5800);
}
// WebSocket связи
socket.on('connect', () => {
socket.emit('register_display', { id: displayId, name: ⁠Дисплей №${terminalNum}⁠ });
});
socket.on('show_qr', (data) => {
hasActiveInvoice = true;
stopCharacterMode();
clearTimeout(idleTimer);
document.getElementById('payAmountDisplay').textContent = data.amount.toLocaleString('ru-RU') + ' ₽';
document.getElementById('qrImage').src = data.qrCode;
showLayer('viewPay');
});
socket.on('processing_payment', () => {
showLayer('viewProcessing');
});
socket.on('payment_success', (data) => {
hasActiveInvoice = false;
const amount = data.transaction ? data.transaction.amount : 0;
document.getElementById('successAmountDisplay').textContent = amount.toLocaleString('ru-RU') + ' ₽';
showLayer('viewSuccess');
const circle = document.getElementById('successCircle');
const check = document.getElementById('successCheck');
circle.classList.remove('run-circle-anim');
check.classList.remove('run-check-anim');
void circle.offsetWidth;
circle.classList.add('run-circle-anim');
check.classList.add('run-check-anim');
setTimeout(() => {
showLayer('viewIdle');
resetIdleTimer();
}, 4800);
});
socket.on('transaction_cancelled', () => {
hasActiveInvoice = false;
showLayer('viewIdle');
resetIdleTimer();
});
socket.on('display_block_status', (data) => {
const overlay = document.getElementById('blockedOverlay');
if (data.isBlocked) {
overlay.classList.add('active');
} else {
overlay.classList.remove('active');
}
});
// Инициализация
resetIdleTimer();
