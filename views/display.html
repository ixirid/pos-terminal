<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Дисплей Клиента — POS</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #10b981;
      --primary-bright: #38ef7d;
      --bg-base: #000000;
      --text-muted: #9ca3af;
      
      --char-green: #38ef7d;
      --char-green-glow: rgba(56, 239, 125, 0.9);
      --char-pink: #ff2a85;
      --char-pink-glow: rgba(255, 42, 133, 0.9);
      --char-blue: #00d2ff;
      --char-blue-glow: rgba(0, 210, 255, 0.9);
      --char-purple: #b5179e;
      --char-purple-glow: rgba(181, 23, 158, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* АМБИЕНТНОЕ СВЕЧЕНИЕ НА ФОНЕ */
    .ambient-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(56, 239, 125, 0.12) 40%, transparent 70%);
      filter: blur(90px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      transition: background 0.8s ease;
    }

    /* ВЕРХНЯЯ ШАПКА */
    .top-header {
      position: absolute;
      top: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .secret-pay-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .secret-pay-btn:active {
      transform: scale(0.92);
      background: rgba(56, 239, 125, 0.25);
      border-color: rgba(56, 239, 125, 0.5);
    }

    .green-dot {
      width: 8px;
      height: 8px;
      background: var(--char-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--char-green);
    }

    /* ОСНОВНЫЕ СЛОИ ЭКРАНОВ */
    .view-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.96);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
      pointer-events: none;
    }

    .view-layer.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
    }

    /* --- 1. ЭКРАН ОЖИДАНИЯ --- */
    .idle-title {
      font-size: 48px;
      font-weight: 900;
      line-height: 1.25;
      text-align: center;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .idle-title .white-text {
      color: #ffffff;
    }

    .idle-title .green-text {
      color: var(--char-green);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 0 25px rgba(56, 239, 125, 0.5);
    }

    .green-check-icon {
      width: 42px;
      height: 42px;
      background: var(--char-green);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      font-weight: 900;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(56, 239, 125, 0.8);
      flex-shrink: 0;
    }

    /* --- 2. ЭКРАН ПЕРСОНАЖА --- */
    .character-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      width: 100%;
      cursor: pointer;
    }

    .eyes-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      height: 130px;
      position: relative;
    }

    .eye-pill {
      width: 125px;
      height: 96px;
      background: var(--char-green);
      border-radius: 42px;
      box-shadow: 0 0 50px var(--char-green-glow);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .eye-pill::after {
      content: '';
      position: absolute;
      top: 15%;
      left: 18%;
      width: 26%;
      height: 26%;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transition: opacity 0.3s ease;
    }

    /* Анимации и Эмоции */
    .eyes-box.blinking .eye-pill {
      height: 10px;
      border-radius: 10px;
      margin-top: 43px;
    }

    .eyes-box.happy .eye-pill {
      height: 64px;
      border-radius: 64px 64px 16px 16px;
      transform: translateY(-6px);
    }

    .eyes-box.heart .eye-pill {
      background: var(--char-pink);
      box-shadow: 0 0 60px var(--char-pink-glow);
      clip-path: none;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eyes-box.heart .eye-pill::after {
      display: none;
    }

    .eyes-box.heart .eye-pill::before {
      content: '♥';
      font-size: 70px;
      color: #ffffff;
      line-height: 1;
    }

    /* Подмигивание */
    .eyes-box.wink .eye-pill:last-child {
      height: 12px;
      border-radius: 12px;
      transform: translateY(20px);
      box-shadow: 0 0 25px var(--char-green-glow);
    }

    .eyes-box.wink .eye-pill:last-child::after {
      opacity: 0;
    }

    .eyes-box.blue .eye-pill {
      background: var(--char-blue);
      box-shadow: 0 0 55px var(--char-blue-glow);
    }

    .eyes-box.purple .eye-pill {
      background: var(--char-purple);
      box-shadow: 0 0 55px var(--char-purple-glow);
    }

    .speech-text {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      line-height: 1.4;
      max-width: 440px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }

    .speech-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- 3. ЭКРАН ОПЛАТЫ ПО QR --- */
    .pay-card-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .pay-amount-num {
      font-size: 48px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
    }

    .qr-card-glass {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      width: 100%;
    }

    .qr-white-bg {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
    }

    .qr-white-bg img {
      width: 190px;
      height: 190px;
      display: block;
    }

    /* --- 4. СВЯЗЬ С СЕРВЕРОМ --- */
    .spinner-circle {
      width: 64px;
      height: 64px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--char-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- 5. ЭКРАН УСПЕХА С ИЗОБРАЖЕНИЕМ ИЗ ВИДЕО --- */
    .success-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      position: relative;
    }

    /* ВЖУХ ТРАЕКТОРИЯ И ДУГА ОПЛАТЫ */
    .pay-anim-canvas {
      width: 220px;
      height: 220px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .anim-svg-element {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    .spiral-swirl {
      stroke: var(--char-green);
      stroke-width: 12;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      filter: drop-shadow(0 0 16px var(--char-green-glow));
    }

    .smile-arc {
      stroke: var(--char-green);
      stroke-width: 18;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      filter: drop-shadow(0 0 20px var(--char-green-glow));
      opacity: 0;
    }

    .checkmark-path {
      stroke: var(--char-green);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      filter: drop-shadow(0 0 24px var(--char-green-glow));
      opacity: 0;
    }

    /* Классы управления кадр за кадром (секунда в секунду по видео) */
    .stage-swirl .spiral-swirl {
      animation: swirlRun 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .stage-smile .spiral-swirl { opacity: 0; }
    .stage-smile .smile-arc {
      opacity: 1;
      animation: smileAppear 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
    }

    .stage-check .smile-arc { opacity: 0; }
    .stage-check .checkmark-path {
      opacity: 1;
      animation: checkmarkDraw 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes swirlRun {
      0% { stroke-dashoffset: 600; transform: rotate(0deg) scale(0.6); opacity: 0.2; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; transform: rotate(360deg) scale(1); opacity: 1; }
    }

    @keyframes smileAppear {
      0% { stroke-dashoffset: 200; transform: translateY(10px) scale(0.8); }
      100% { stroke-dashoffset: 0; transform: translateY(0) scale(1); }
    }

    @keyframes checkmarkDraw {
      0% { stroke-dashoffset: 180; transform: scale(0.7) rotate(-10deg); }
      60% { transform: scale(1.15) rotate(4deg); }
      100% { stroke-dashoffset: 0; transform: scale(1) rotate(0deg); }
    }

    .success-text-box {
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .success-text-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* НИЖНИЙ ПОДВАЛ */
    .bottom-footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 100;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* БЛОКИРОВКА */
    .block-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .block-modal.active { display: flex !important; }
  </style>
</head>
<body>

  <!-- ФОНОВОЕ СВЕЧЕНИЕ -->
  <div class="ambient-glow" id="ambientGlow"></div>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="top-header">
    <button class="secret-pay-btn" id="paySecretBtn" type="button">
      <span class="green-dot"></span>
      <span>Pay</span>
    </button>
    <div style="font-size: 12px; font-weight: 700; color: var(--text-muted);">POS System</div>
  </header>

  <!-- 1. ГЛАВНЫЙ ЭКРАН ОЖИДАНИЯ -->
  <div class="view-layer active" id="viewIdle">
    <h1 class="idle-title">
      <span class="white-text">Платите</span>
      <span class="white-text">как вам</span>
      <span class="green-text">удобно <span class="green-check-icon">✓</span></span>
    </h1>
  </div>

  <!-- 2. ЭКРАН ПЕРСОНАЖА -->
  <div class="view-layer" id="viewCharacter">
    <div class="character-stage" id="characterStage">
      <div class="eyes-box" id="eyesBox">
        <div class="eye-pill"></div>
        <div class="eye-pill"></div>
      </div>
      <div class="speech-text" id="speechText">
        — Привет! Я очень рад вас видеть!
      </div>
    </div>
  </div>

  <!-- 3. ЭКРАН ОПЛАТЫ ПО QR -->
  <div class="view-layer" id="viewPay">
    <div class="pay-card-container">
      <div style="text-align: center;">
        <div style="font-size: 14px; color: var(--text-muted); font-weight: 700;">Сумма к оплате</div>
        <div class="pay-amount-num" id="payAmountDisplay">0 ₽</div>
      </div>

      <div class="qr-card-glass">
        <div style="font-size: 16px; font-weight: 800; color: #fff;">Оплатить по QR-коду</div>
        <div class="qr-white-bg">
          <img id="qrImage" src="" alt="QR-код">
        </div>
        <div style="font-size: 12px; color: var(--char-green); font-weight: 700;">
          ● Отсканируйте приложением банка
        </div>
      </div>
    </div>
  </div>

  <!-- 4. СВЯЗЬ С СЕРВЕРОМ -->
  <div class="view-layer" id="viewProcessing">
    <div class="spinner-circle"></div>
    <div style="font-size: 20px; font-weight: 800; color: #fff;">Связь с сервером...</div>
  </div>

  <!-- 5. ОПЛАЧЕНО (АНИМАЦИЯ ИЗ ВИДЕО) -->
  <div class="view-layer" id="viewSuccess">
    <div class="success-stage">
      <div class="pay-anim-canvas" id="animCanvas">
        <svg class="anim-svg-element" viewBox="0 0 200 200">
          <!-- 1. Спиральный вжух след -->
          <path class="spiral-swirl" d="M 100,100 m -60,0 a 60,60 0 1,0 120,0 a 60,60 0 1,0 -120,0 A 45,45 0 1,0 145,100" />
          <!-- 2. Зеленая дуга-улыбка -->
          <path class="smile-arc" d="M 35,95 Q 100,165 165,95" />
          <!-- 3. Зеленая галочка успеха -->
          <path class="checkmark-path" d="M 42,102 L 84,144 L 162,62" />
        </svg>
      </div>
      <div class="success-text-box" id="successTextBox">
        <div style="font-size: 44px; font-weight: 900; color: #fff;" id="successAmountDisplay">0 ₽</div>
        <div style="font-size: 22px; font-weight: 800; color: var(--char-green); margin-top: 4px;">Оплачено</div>
      </div>
    </div>
  </div>

  <!-- НИЖНИЙ ПОДВАЛ -->
  <footer class="bottom-footer">
    <span id="terminalNumberLabel">Терминал №3815</span>
  </footer>

  <!-- БЛОКИРОВКА -->
  <div class="block-modal" id="blockedOverlay">
    <div style="font-size: 40px;">🔒</div>
    <h2 style="font-size: 20px; font-weight: 800; color: #fff;">Дисплей заблокирован</h2>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const socket = io();
      
      let displayId = localStorage.getItem('pos_display_id');
      if (!displayId) {
        displayId = 'disp_' + Math.random().toString(36).substring(2, 7);
        localStorage.setItem('pos_display_id', displayId);
      }
      
      const terminalNum = displayId.replace(/\D/g, '').substring(0, 4) || '3815';
      const termLabel = document.getElementById('terminalNumberLabel');
      if (termLabel) termLabel.textContent = `Терминал №${terminalNum}`;

      const REPLICAS = [
        { text: "— Привет! Я очень рад вас видеть!", emotion: "happy" },
        { text: "— Оплату по QR-коду можно провести с мобильного приложения!", emotion: "wink" },
        { text: "— Вы можете оплатить любую покупку быстро и без комиссии!", emotion: "happy" },
        { text: "— Наведите камеру телефона на QR-код для моментальной оплаты!", emotion: "blue" },
        { text: "— Хорошего дня и замечательных покупок!", emotion: "happy" },
        { text: "— Платить по QR — это удобно, технологично и безопасно!", emotion: "purple" },
        { text: "— Спасибо, что вы с нами!", emotion: "heart" }
      ];

      let currentView = 'viewIdle';
      let idleTimer = null;
      let characterLoopTimeout = null;
      let hasActiveInvoice = false;
      let replicaIndex = 0;

      function switchView(targetViewId) {
        currentView = targetViewId;
        document.querySelectorAll('.view-layer').forEach(layer => {
          layer.classList.remove('active');
        });

        const activeLayer = document.getElementById(targetViewId);
        if (activeLayer) {
          activeLayer.classList.add('active');
        }

        const glow = document.getElementById('ambientGlow');
        if (targetViewId === 'viewCharacter' || targetViewId === 'viewSuccess') {
          glow.style.background = 'radial-gradient(circle, rgba(56, 239, 125, 0.5) 0%, rgba(16, 185, 129, 0.2) 60%, transparent 100%)';
        } else {
          glow.style.background = 'radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(56, 239, 125, 0.12) 40%, transparent 70%)';
        }
      }

      function resetIdleTimer() {
        clearTimeout(idleTimer);
        if (hasActiveInvoice) return;

        idleTimer = setTimeout(() => {
          startCharacterMode();
        }, 15000);
      }

      function startCharacterMode() {
        clearTimeout(idleTimer);
        switchView('viewCharacter');
        runCharacterCycle();
      }

      function stopCharacterMode() {
        clearTimeout(characterLoopTimeout);
        const textEl = document.getElementById('speechText');
        if (textEl) textEl.classList.remove('visible');
      }

      function exitCharacterMode() {
        if (currentView === 'viewCharacter') {
          stopCharacterMode();
          switchView('viewIdle');
          resetIdleTimer();
        }
      }

      function runCharacterCycle() {
        if (currentView !== 'viewCharacter') return;

        const currentReplica = REPLICAS[replicaIndex];
        replicaIndex = (replicaIndex + 1) % REPLICAS.length;

        const eyesBox = document.getElementById('eyesBox');
        const speechText = document.getElementById('speechText');

        speechText.classList.remove('visible');

        setTimeout(() => {
          eyesBox.className = 'eyes-box ' + currentReplica.emotion;

          setTimeout(() => {
            eyesBox.classList.add('blinking');
            setTimeout(() => eyesBox.classList.remove('blinking'), 160);
          }, 150);

          setTimeout(() => {
            speechText.textContent = currentReplica.text;
            speechText.classList.add('visible');
          }, 350);

        }, 250);

        characterLoopTimeout = setTimeout(() => {
          runCharacterCycle();
        }, 4500);
      }

      // ТАКТОВАЯ СЕКУНДНАЯ АНИМАЦИЯ УСПЕХА
      function playExactVideoSuccessAnimation() {
        const animCanvas = document.getElementById('animCanvas');
        const textBox = document.getElementById('successTextBox');

        animCanvas.className = 'pay-anim-canvas';
        textBox.classList.remove('show');

        // 1. Кадр: Вжух-спираль (0.0s - 0.75s)
        setTimeout(() => {
          animCanvas.className = 'pay-anim-canvas stage-swirl';
        }, 50);

        // 2. Кадр: Трансформация в дугу-улыбку (0.75s - 1.25s)
        setTimeout(() => {
          animCanvas.className = 'pay-anim-canvas stage-smile';
        }, 800);

        // 3. Кадр: Галочка и появление суммы (1.3s+)
        setTimeout(() => {
          animCanvas.className = 'pay-anim-canvas stage-check';
          textBox.classList.add('show');
        }, 1350);
      }

      // СЕКРЕТНАЯ КНОПКА "Pay"
      const secretBtn = document.getElementById('paySecretBtn');
      if (secretBtn) {
        secretBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (hasActiveInvoice) return;

          if (currentView === 'viewCharacter') {
            exitCharacterMode();
          } else {
            startCharacterMode();
          }
        });
      }

      // КЛИК ПО ЭКРАНУ ПЕРСОНАЖА ДЛЯ ВЫХОДА
      const charLayer = document.getElementById('viewCharacter');
      if (charLayer) {
        charLayer.addEventListener('click', () => {
          exitCharacterMode();
        });
      }

      // ОТСЛЕЖИВАНИЕ ДЕЙСТВИЙ ДЛЯ СБРОСА ТАЙМЕРА 15 СЕК
      ['click', 'touchstart', 'mousemove'].forEach(evt => {
        window.addEventListener(evt, () => {
          if (currentView === 'viewIdle') {
            resetIdleTimer();
          }
        }, { passive: true });
      });

      // SOCKET.IO СОБЫТИЯ
      socket.on('connect', () => {
        socket.emit('register_display', { id: displayId, name: `Дисплей №${terminalNum}` });
      });

      socket.on('show_qr', (data) => {
        hasActiveInvoice = true;
        stopCharacterMode();
        clearTimeout(idleTimer);

        document.getElementById('payAmountDisplay').textContent = data.amount.toLocaleString('ru-RU') + ' ₽';
        document.getElementById('qrImage').src = data.qrCode;
        switchView('viewPay');
      });

      socket.on('processing_payment', () => {
        switchView('viewProcessing');
      });

      socket.on('payment_success', (data) => {
        hasActiveInvoice = false;
        const amount = data.transaction ? data.transaction.amount : 0;
        document.getElementById('successAmountDisplay').textContent = amount.toLocaleString('ru-RU') + ' ₽';

        switchView('viewSuccess');
        playExactVideoSuccessAnimation();

        setTimeout(() => {
          switchView('viewIdle');
          resetIdleTimer();
        }, 5500);
      });

      socket.on('transaction_cancelled', () => {
        hasActiveInvoice = false;
        switchView('viewIdle');
        resetIdleTimer();
      });

      socket.on('display_block_status', (data) => {
        const modal = document.getElementById('blockedOverlay');
        if (modal) {
          if (data.isBlocked) {
            modal.classList.add('active');
          } else {
            modal.classList.remove('active');
          }
        }
      });

      // ИНИЦИАЛИЗАЦИЯ
      resetIdleTimer();
    });
  </script>
</body>
</html>
